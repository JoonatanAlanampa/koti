name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # The disassembler behind tools/ktrace.py --image. Needs no iverilog, no
      # cocotb and no RISC-V toolchain, so it runs first and fails in a second.
      # Its expected strings all came out of GNU binutils rather than out of
      # anyone's head, and it carries a POSITIVE control for the straddle audit:
      # an audit that cannot fire prints "0 sites" and reads exactly like a
      # clean bill of health.
      - name: disassembler and the straddle audit
        run: python3 test/test_rvdis.py

      # The font ROM is GENERATED, COMMITTED, and read by two consumers that
      # must agree — vga_text.sv scans it out, screenshot.py reconstructs the
      # README's screens from it. Nothing checked either until 2026-08-08, when
      # lowercase was added by deleting a fold in the RTL and a `continue` in
      # the generator. Doing one without the other renders the wrong glyph and
      # fails no test.
      - name: the font ROM is the font we think it is
        run: python3 test/test_font.py

      # The four source lists and src/ must agree. Cheap, needs nothing, and it
      # runs FIRST because it catches the failure that has cost this repo two
      # red runs in one day: a file added to src/ that a list was never told
      # about ("Unknown module type"), and a file deleted from src/ that a list
      # still names ("File not found"). Both stop the build before any test
      # runs, so finding them here saves the whole job.
      - name: The source lists agree with src/
        run: python3 test/check_sources.py

      # sdram_ctrl against a strict behavioural part. Standalone because the
      # controller is verified before it goes anywhere near the SoC — a memory
      # controller that is wrong in a corner is far cheaper to find here than
      # under a running kernel.
      - name: SDRAM controller
        run: |
          cd test
          python run_sdram.py
          ! grep failure results_sdram.xml

      # icache standalone. Pure Verilog on purpose — no cocotb — so it also runs
      # on the Windows host, where cocotb is not installed and every other suite
      # therefore costs a CI round trip.
      #
      # It asserts on the MEMORY TRANSACTION COUNT, not just on returned data. A
      # cache whose `valid` never sets returns correct data for every request
      # and delivers none of the speedup, so counting is the only check that
      # tells a working cache from an expensive wire.
      - name: I-cache
        run: |
          cd test
          iverilog -g2012 -o tb_icache.vvp ../src/icache.sv tb_icache.v
          vvp tb_icache.vvp | tee icache.log
          grep -q "tb_icache: PASS" icache.log

      # D-cache, same pattern and for a sharper reason. This one is WRITE-
      # THROUGH because the video DMA reads the charbuf out of the same SDRAM
      # the CPU writes; a write-back cache would pass every hit-rate check and
      # silently leave text off the screen. So the bench counts memory WRITES
      # as carefully as it counts hits, and it also pins the page-table bypass —
      # a cached PTE would outlive the sfence.vma meant to retire it.
      - name: D-cache
        run: |
          cd test
          iverilog -g2012 -o tb_dcache.vvp ../src/dcache.sv tb_dcache.v
          vvp tb_dcache.vvp | tee dcache.log
          grep -q "tb_dcache: PASS" dcache.log

          # The keyboard's two-port FIFO. It had no bench of its own until
          # 2026-08-08: it was compiled only into whole-SoC builds, which
          # notice a keyboard that is dead and notice nothing about a second
          # reader that steals the first one's keystrokes. The property it
          # guards is that a stalled Linux driver cannot starve the console.
          iverilog -g2012 -o tb_usb_kbd.vvp ../src/usb_kbd.sv tb_usb_kbd.v
          vvp tb_usb_kbd.vvp | tee usb_kbd.log
          grep -q "tb_usb_kbd: PASS" usb_kbd.log

          # F3, re-expressed at module level. It had a cocotb test in the ASIC
          # configuration; that configuration was removed on 2026-08-08 when
          # koti became FPGA-only, and the defect did not retire with it. A
          # video refill that has been granted must finish even if software
          # disables the display, or the arbiter parks holding a grant for a
          # request that no longer exists and the CPU stalls forever.
          iverilog -g2012 -I ../src -o tb_vga_grant.vvp             ../src/vga_text.sv ../src/vga_timing.sv tb_vga_grant.v
          vvp tb_vga_grant.vvp | tee vga_grant.log
          grep -q "tb_vga_grant: PASS" vga_grant.log

      # PLIC standalone, same pure-Verilog pattern. An interrupt controller is
      # another block that can be wrong by being QUIET: one that never asserts
      # eip breaks nothing visible in a polling system, it just means
      # interrupts never arrive. The bench therefore asserts on the
      # claim/complete SEQUENCE, and its own discriminating power was checked
      # by mutation — flipping the threshold comparison, the tie-break
      # direction, or the in-flight latch each make it fail.
      - name: PLIC
        run: |
          cd test
          iverilog -g2012 -o tb_plic.vvp ../src/plic.sv tb_plic.v
          vvp tb_plic.vvp | tee plic.log
          grep -q "tb_plic: PASS" plic.log

      # The SD path, standalone, against a Verilog card model. This is the rung
      # that turns a booting kernel into a computer — it is both how a 3.95 MB
      # kernel gets into the machine and where the rootfs will live — so it is
      # verified before it goes anywhere near the SoC, for the same reason
      # sdram_ctrl and plic are: wrong-in-a-corner storage is far cheaper to find
      # here than under a running kernel, where the symptom is a corrupt
      # filesystem ten million instructions later.
      #
      # The payload is DERIVED FROM THE BLOCK NUMBER, and the bench reads two
      # different blocks. A constant payload would pass even if every read
      # returned block 0.
      - name: SD block reads
        run: |
          cd test
          iverilog -g2012 -o tb_sd.vvp ../src/sd_ctrl.sv ../vendor/sd_spi.sv             ../vendor/spi_master.sv sd_card_model.sv tb_sd.v
          vvp tb_sd.vvp | tee sd.log
          grep -q "tb_sd: PASS" sd.log

      # The machine description has to actually compile. koti.dts went into the
      # repo unvalidated because there is no dtc on the development host, and
      # a devicetree that is quoted as the machine's definition but has never
      # been through a compiler is a latent boot failure.
      # WARNINGS ARE FAILURES here, and deliberately so. dtc exits 0 on a
      # warning, so the first version of this step went green while reporting
      # that /soc/timer had no reg property — a real modelling error (a node
      # with no address does not belong on a simple-bus) sitting in a file
      # quoted as the machine's definition. A devicetree is read by exactly one
      # consumer, once, early, with no console up yet; there is no good time to
      # find out it was approximately right.
      - name: Devicetree
        run: |
          sudo apt-get install -y device-tree-compiler
          dtc -I dts -O dtb -o /tmp/koti.dtb sw/linux/koti.dts 2>dtc.log
          cat dtc.log
          ! grep -q Warning dtc.log
          dtc -I dtb -O dts /tmp/koti.dtb > /dev/null

      # The suite above drives tt_um_koti directly. This one drives the ULX3S
      # harness (fpga/ulx3s/ulx3s_top.sv) through the J1 header wires, which is
      # the only thing that exercises the Pmod row permutation, the orientation
      # straps and the UART source mux. See test/test_fpga.py.
      - name: ULX3S harness simulation
        run: |
          cd test
          python run_fpga.py
          ! grep failure results_fpga.xml

      # The variant that actually goes on the board today, because J1 is bare
      # holes until the Cartridge Pmod arrives: the boot flash is
      # fpga/ulx3s/bram_flash.sv, a QSPI device in fabric on the same eight uio
      # wires. The step above cannot cover it — it drives the header pins, and
      # in this build nothing is listening to them.
      #
      # Plain Verilog rather than cocotb, so it also runs on the development
      # host in seconds. What it is really guarding is ONE thing: that the model
      # answers on the edge qspi_ctrl samples. One edge out and every fetched
      # word is shifted by a bit, which on the bench is a board that configures,
      # blinks, and never says anything.
      - name: ULX3S harness with the fabric boot flash
        run: |
          mkdir -p fpga/ulx3s/build
          python3 fpga/ulx3s/mkflashhex.py sw/bringup.bin fpga/ulx3s/build/flash.hex
          iverilog -g2012 -I src -DKOTI_FLASH_BRAM \
            -o tb_fpga_bram.vvp src/*.sv src/usb_hid_host_rom.v vendor/*.sv vendor/*.v \
            fpga/ulx3s/bram_flash.sv fpga/ulx3s/ulx3s_top.sv \
            test/sdram_model.sv test/sd_card_model.sv \
            test/sim_prims.v test/tb_fpga_bram.v \
            2>&1 | grep -v "sorry:" || true
          vvp tb_fpga_bram.vvp | tee fpga_bram.log
          grep -q "tb_fpga_bram: PASS" fpga_bram.log

      # The SD_RAW escape hatch, exercised end to end: sdraw.bin hand-clocks
      # CMD0 through the MMIO register with the sd_spi engine muxed off the
      # pins, and the card model answers R1 = 01. This is the instrument that
      # decides, on real hardware, whether a silent card is the card's fault or
      # koti's — so it needs a gate of its own. It also pins the .data LMA
      # alignment: sdraw is the only image with a non-empty .data, and a
      # misaligned load address makes crt0 trap and the program restart forever.
      - name: the SD bring-up escape hatch
        run: |
          mkdir -p fpga/ulx3s/build
          python3 fpga/ulx3s/mkflashhex.py sw/sdraw.bin fpga/ulx3s/build/flash.hex
          iverilog -g2012 -I src -DKOTI_FLASH_BRAM \
            -o tb_sdraw.vvp src/*.sv src/usb_hid_host_rom.v vendor/*.sv vendor/*.v \
            fpga/ulx3s/bram_flash.sv fpga/ulx3s/ulx3s_top.sv \
            test/sdram_model.sv test/sd_card_model.sv \
            test/sim_prims.v test/tb_fpga_bram.v \
            2>&1 | grep -v "sorry:" || true
          vvp tb_sdraw.vvp +mark=2 | tee sdraw.log
          grep -q "tb_fpga_bram: PASS" sdraw.log

      # THE KERNEL TRANSPORT. koti boots from a 32 KB block RAM and the kernel
      # is 3.95 MB, so the microSD is the only route that is not measured in
      # minutes per attempt. This runs the REAL firmware out of the fabric
      # flash, with a real koti boot header and a real checksum on the modelled
      # card, and both directions matter:
      #   with an image  -> it loads and the checksum matches
      #   without one    -> it changes nothing and the flash payload still runs
      # The second is the one that keeps a bring-up board bootable when the
      # card is missing, and it is the easier of the two to break silently.
      - name: the microSD kernel transport
        run: |
          mkdir -p fpga/ulx3s/build
          python3 tools/sdkernel.py fake --blocks 8 --out fake_kernel.bin
          python3 tools/sdkernel.py build fake_kernel.bin --hex boot.hex
          python3 fpga/ulx3s/mkflashhex.py sw/sbi/sbi_sd.bin \
            fpga/ulx3s/build/flash.hex
          iverilog -g2012 -I src -DKOTI_FLASH_BRAM \
            -o tb_sdboot.vvp src/*.sv src/usb_hid_host_rom.v vendor/*.sv vendor/*.v \
            fpga/ulx3s/bram_flash.sv fpga/ulx3s/ulx3s_top.sv \
            test/sdram_model.sv test/sd_card_model.sv \
            test/sim_prims.v test/tb_fpga_bram.v \
            2>&1 | grep -v "sorry:" || true
          # +sw3=1 because the firmware enables VGA, which gives uo[0] to the
          # raster and mirrors the UART on uo[6] — a real DIP switch, not a
          # bench detail.
          vvp tb_sdboot.vvp +mark=3 +sw3=1 \
            +sdimg=boot.hex +sdimg_lba=2048 | tee sdboot.log
          grep -q "tb_fpga_bram: PASS" sdboot.log
          grep -q "sd: loading kernel ok" sdboot.log

          # The fallback. The bench has no marker to find here and ends in its
          # clock-limit FATAL, so `|| true` is expected — the assertions are the
          # greps: the flash payload ran, and the loader stayed silent.
          vvp tb_sdboot.vvp +mark=3 +sw3=1 | tee nocard.log || true
          grep -q "STK" nocard.log
          if grep -q "sd: loading" nocard.log; then
            echo "loader announced work with no image on the card"; exit 1
          fi

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/tb_fpga.fst
            test/results.xml
            test/results_fpga.xml
            test/results_sdram.xml
            test/output/*
