# linux — build the kernel koti is supposed to boot, and the machine
# description it is handed.
#
# This runs in CI and not on the development host for two reasons: it is a
# multi-gigabyte source tree and a ten-minute build, and the host's RISC-V
# compiler (xpack riscv-none-elf, used by sw/build.py) is a bare-metal newlib
# toolchain that cannot build a kernel at all.
#
# It deliberately does NOT use Buildroot, which is the usual answer to
# "I need a riscv32-linux toolchain". Buildroot's value is that it builds a
# libc and a userspace; the kernel is freestanding and links no libc, so
# Ubuntu's stock `gcc-riscv64-linux-gnu` builds it directly once told
# `-march=rv32ima -mabi=ilp32` — which the kernel's own Makefile does from
# CONFIG_ARCH_RV32I. That turns a 40-minute cold build with a large surface of
# things that can go wrong into a ~10-minute one, which matters when every
# debug round trip has to happen in CI. Buildroot comes back at the point
# koti wants a real userspace (busybox, a shell) rather than the one-program
# initramfs below.
name: linux
on:
  push:
    # The `boot` job below is the standing regression test for two CPU defects
    # that live in src/ — the AMO/page-walk livelock in koti_core.sv and the
    # dropped-request deadlock in arbiter3.sv — and until 2026-08-04 this
    # workflow did not trigger on src/ at all. A change to either file would
    # have gone green on all four other workflows while silently reintroducing
    # a hang that no other suite can reach. The commit that fixed the AMO
    # livelock only ran this workflow because it happened to touch
    # sw/linux/README.md in the same commit; that was luck, not coverage.
    #
    # So the trigger list is now everything the `boot` job actually consumes.
    # The whole workflow runs rather than just `boot`, because `boot` needs the
    # Image that `kernel` builds; on a public repo the runner minutes are free
    # and ~15 minutes is cheap against the failure mode, which is a machine
    # that hangs on real hardware with a blank console.
    paths:
      - 'sw/linux/**'
      - 'src/**'                       # the machine the kernel boots on
      - 'sw/sbi/**'                    # the firmware that enters it
      - 'test/tb_boot.v'               # the bench
      - 'test/sim_mem.sv'              # and its memory model
      - 'test/mkhex.py'                # how the images are loaded
      - '.github/workflows/linux.yaml'
  # Boot experiments are dispatchable, because this runner is about five times
  # faster at the boot bench than the development host (~29k simulated clocks
  # per second against ~5-6k), and a boot that has to be chased past where the
  # default limits stop is exactly the case where that matters. The defaults
  # below are the values a push uses, so a push is unchanged.
  workflow_dispatch:
    inputs:
      # Raised 15M -> 20M 2026-08-05, to buy margin for the assertions below
      # rather than for its own sake. At 15M "devtmpfs: initialized" was the
      # LAST line printed, arriving with almost nothing to spare, so asserting
      # it would have turned any 5% slowdown into a red run that meant nothing.
      # 20M leaves about a third in hand. It costs ~3 minutes a push, against a
      # failure mode of a machine that hangs on real hardware with a blank
      # console. Deeper coverage is a workflow_dispatch away.
      maxclk:
        description: 'boot: give up after this many clocks (blank = 20M, or 250M when full=yes)'
        default: ''
      # ⚠️ RAISED 4M -> 8M 2026-08-05, because 4M had become WRONG rather than
      # merely tight. The BLAKE2s self-test (blake2s_mod_init, a device_initcall
      # two entries after the io schedulers) hashes 256 test vectors and prints
      # NOTHING while it does, which on this machine is a legitimate silence of
      # roughly 5M clocks. Any run whose maxclk reaches ~27M therefore hit the
      # 4M window mid-self-test and reported "assuming stuck" about a kernel
      # that was working perfectly. This project has already lost a day to that
      # exact verdict once, from the same window at a different clock.
      # ⚠️ 2026-08-06: THIS HEURISTIC IS MEASURING THE WRONG THING LATE IN THE
      # BOOT, and that is why it must be effectively off for a full run. After
      # the PLIC probe koti goes legitimately silent for a very long time: the
      # next fourteen initcalls (simple_pm_bus, three clk drivers, n_null, pty,
      # hvc_sbi, random_sysctls, topology_sysfs, cacheinfo_sysfs, serport,
      # atkbd, psmouse, hid, hid_generic) print NOTHING, and the initramfs is
      # being gunzipped and unpacked underneath them on an async kthread. That
      # was traced symbol by symbol on 2026-08-06 — kernfs_name_hash and strcmp,
      # then vsnprintf, then inflate_fast and zlib_inflate_table, then `eat` in
      # init/initramfs.c — at 40 to 127 DISTINCT addresses per symbol, which is
      # ktrace.py's own test for "slow, not stuck". The machine was healthy.
      #
      # That makes three separate times a silent-but-working koti has been read
      # as a hang. And the real rootfs is roughly forty times the archive the
      # trace was taken on, so this silence gets LONGER, not shorter.
      quiet:
        description: 'boot: give up after this many clocks with no output (blank = 8M, or ~off when full=yes)'
        default: ''
      trace:
        description: 'boot: print the fetch PC every N clocks (0 = off)'
        default: '0'
      # The coarse trace above answers "what is it doing"; these answer "what is
      # the loop", which is the only resolution at which a stuck instruction
      # explains itself. tb_boot.v has supported both since it was written and
      # the workflow simply never passed them on, so reaching for them meant
      # editing this file — in the middle of a debugging session, which is
      # exactly when nobody wants to.
      tfrom:
        description: 'boot: start the per-clock trace at this clock'
        default: '0'
      tlen:
        description: 'boot: per-clock trace length, in clocks (0 = off)'
        default: '0'
      # `rootfs` is the real userspace — busybox on musl, an inittab, a getty.
      # `init` is sw/linux/init.S, the ~20-instruction stand-in that prints the
      # marker and asks for power-off.
      #
      # init.S is KEPT and kept reachable rather than deleted, because the two
      # answer different questions. The stand-in proves execve works and the
      # console is up, in about 30 KB and with no libc, no shell and no
      # scheduler pressure; the real rootfs proves the machine is USABLE. When
      # a boot fails somewhere after execve, the first useful question is
      # whether it fails with the stand-in too, and that has to be one input
      # away rather than a revert.
      initramfs:
        description: 'kernel: which initramfs to embed'
        default: 'rootfs'
        type: choice
        options: ['rootfs', 'init']
      # Whether this run is allowed to CLAIM that koti reaches userspace.
      #
      # It is a declaration by the caller and deliberately not inferred from
      # maxclk, because inferring it would need a threshold, and a threshold set
      # slightly too low is a gate that silently stops applying — which is the
      # exact defect this workflow was just repaired for. Declared, it is one
      # word and it is unambiguous.
      #
      # Why the two are separate at all: reaching a shell is on the order of
      # 1e8 clocks, which is upwards of an hour of iverilog even on a runner
      # that does ~25k clocks/s. A push cannot afford that on every change to
      # src/, and the `boot` job's real job on a push is regression cover for
      # the two CPU defects it found (the AMO/page-walk livelock and the
      # dropped-request deadlock), which show up in the first few million
      # clocks. So a push runs the cheap partial boot and SAYS SO; the
      # userspace claim is checked by a run that asks for it.
      # ✅ 2026-08-07: this is no longer the slow, rare, remembered-by-somebody
      # run it was written as. Under Verilator a full boot to userspace is 700M
      # clocks in about seven minutes, so `boot-verilator` DEFAULTS to full on a
      # push and the userspace claim is a standing gate. The input stays for the
      # cases that want the opposite: a deliberately partial run, or a full run
      # under the 4-state engine (~4.7 hours — see `engine`).
      full:
        description: 'boot: run to userspace and require it (verilator ~7 min; iverilog ~4.7 h)'
        default: 'no'
        type: choice
        options: ['no', 'yes']
      # Which simulator boots the image. A push leaves this null and gets
      # `iverilog` — the 4-state engine, unchanged, and still the regression
      # gate for the three CPU defects only a real kernel has ever surfaced.
      #
      # `verilator` exists because it is ~55-70x faster (measured: 1.6-2.0M
      # clocks/s against iverilog's 25-29k on the same runner and the same
      # image), which is what makes a full boot to userspace a 2-3 minute job
      # instead of an hour. It is also 2-STATE, so it cannot see an
      # x-propagation defect — the class the SDRAM read-window bug belonged to.
      # Hence a choice rather than a swap: `both` runs the two engines on one
      # image, which is how they get compared.
      #
      # ⚠️ `iverilog` + `full=yes` is on the order of 2.4 HOURS. That is the
      # combination to avoid unless the 4-state answer is specifically what is
      # wanted; `verilator` + `full=yes` answers the same question in minutes.
      engine:
        description: 'boot: which simulator (iverilog = 4-state gate, verilator = ~60x faster)'
        default: 'iverilog'
        type: choice
        options: ['iverilog', 'verilator', 'both']

env:
  # Pinned, not "latest": the kernel config in sw/linux/koti_defconfig was
  # written against this version's Kconfig (RISCV_SBI_V01, NONPORTABLE,
  # ARCH_RV32I), and sw/linux/check_config.py asserts the symbols still
  # resolve. Bumping this is a deliberate act with a checklist, not a default.
  KVER: '6.12'

jobs:
  # Fast job, kept separate on purpose: the devicetree blob is what
  # sw/sbi/dtb.S embeds in flash, and waiting ten minutes behind a kernel
  # build to regenerate a 2 KB file is not a loop anyone will use.
  dtb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      # Warnings are failures here for the same reason as in test.yaml: dtc
      # exits 0 on a warning, and a devicetree is read once, early, by exactly
      # one consumer, with no console up yet.
      - name: Compile koti.dts
        run: |
          dtc -I dts -O dtb -o koti.dtb sw/linux/koti.dts 2>dtc.log
          cat dtc.log
          ! grep -q Warning dtc.log
          ls -l koti.dtb

      # Uploaded BEFORE it is compared, so that the run which tells you the
      # committed blob is stale is also the run you get the fresh one from.
      - uses: actions/upload-artifact@v7
        with:
          name: koti-dtb
          path: koti.dtb

      # The committed blob is what actually ships inside sbi_test.bin, so it
      # has to still mean the same thing as the .dts next to it. Compared
      # through `dtc -I dtb -O dts` rather than byte for byte, so a dtc
      # version bump that changes padding does not read as a stale blob.
      - name: The committed blob still matches the source
        run: |
          stale() {
            echo
            echo "sw/linux/koti.dtb does not match sw/linux/koti.dts."
            echo "Download the koti-dtb artifact from this run, commit it as"
            echo "sw/linux/koti.dtb, and rebuild the firmware"
            echo "(python sw/sbi/build.py) so sbi_test.bin carries the new"
            echo "blob at flash 0x6000."
            exit 1
          }
          test -f sw/linux/koti.dtb || { echo "no committed blob"; stale; }
          dtc -I dtb -O dts -o fresh.dts koti.dtb 2>/dev/null
          dtc -I dtb -O dts -o committed.dts sw/linux/koti.dtb 2>/dev/null
          diff -u committed.dts fresh.dts || stale

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio kmod rsync xz-utils
          riscv64-linux-gnu-gcc --version | head -1

      # The compiler is a riscv64 one. Prove it can emit the 32-bit soft-float
      # code this kernel needs BEFORE spending ten minutes finding out in the
      # middle of a build, and prove it as ELF32 rather than by trusting that
      # -march was accepted.
      - name: The riscv64 compiler really emits rv32
        run: |
          echo 'int f(int x){return x*3;}' > /tmp/t.c
          riscv64-linux-gnu-gcc -march=rv32ima_zicsr_zifencei -mabi=ilp32 \
            -ffreestanding -nostdlib -c /tmp/t.c -o /tmp/t.o
          riscv64-linux-gnu-readelf -h /tmp/t.o | grep -E 'Class|Machine'
          riscv64-linux-gnu-readelf -h /tmp/t.o | grep -q ELF32

      - name: Cache the kernel tarball
        id: tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ env.KVER }}.tar.xz
          key: linux-tarball-${{ env.KVER }}

      - name: Fetch the kernel
        if: steps.tarball.outputs.cache-hit != 'true'
        run: |
          curl -fL -o linux-${KVER}.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz

      - name: Unpack
        run: tar xf linux-${KVER}.tar.xz

      # koti's microSD block driver. Mainline has no driver for src/sd_ctrl.sv —
      # it is not an SDHCI and not an MMC host — and it has to be BUILT IN
      # rather than a module, because it is the device a root filesystem would
      # live on.
      #
      # Injected by COPY + APPEND rather than as a patch, deliberately: a
      # context patch breaks on every kernel version bump and fails in a way
      # that looks like the driver's fault, while appending a Kconfig stanza and
      # one Makefile line survives. `depends on BLOCK` rather than BLK_DEV
      # because the append lands after `endif # BLK_DEV`, so the symbol is
      # outside that block and must state its own dependency.
      - name: Add koti's microSD block driver
        working-directory: linux-${{ env.KVER }}
        run: |
          cp ../sw/linux/koti_sd.c drivers/block/
          # printf rather than a heredoc: Kconfig needs column-0 keywords and
          # tabs, and YAML would force the heredoc body to be indented. The
          # obvious fix — sed -i to un-indent afterwards — would rewrite the
          # WHOLE file, not just the part just appended.
          printf '\nconfig KOTI_SD\n\tbool "Koti-1 microSD block driver"\n\tdepends on BLOCK\n\thelp\n\t  Block driver for koti'"'"'s microSD controller (src/sd_ctrl.sv).\n\t  Read-only: the SPI engine implements CMD17 and has no CMD24,\n\t  so the hardware cannot write a block at all.\n' >> drivers/block/Kconfig
          printf 'obj-$(CONFIG_KOTI_SD)\t+= koti_sd.o\n' >> drivers/block/Makefile
          tail -12 drivers/block/Kconfig
          grep -n koti drivers/block/Makefile

      # koti's keyboard as a real INPUT device. Until 2026-08-08 keystrokes
      # reached Linux only as console characters through the SBI firmware, so
      # there was no /dev/input at all. This does not replace that path -- the
      # gateware has a second, independent read port precisely so both can run
      # (see src/usb_kbd.sv). Same printf-not-heredoc reasoning as above.
      - name: Add koti's keyboard input driver
        working-directory: linux-${{ env.KVER }}
        run: |
          cp ../sw/linux/koti_kbd.c drivers/input/keyboard/
          printf '\nconfig KEYBOARD_KOTI\n\ttristate "Koti-1 USB HID keyboard"\n\tdepends on INPUT\n\tselect INPUT_KEYBOARD\n\thelp\n\t  Input driver for koti'"'"'s USB HID keyboard block (src/usb_kbd.sv).\n\t  Reads the second FIFO port so the SBI console keeps its own.\n' >> drivers/input/keyboard/Kconfig
          printf 'obj-$(CONFIG_KEYBOARD_KOTI)\t+= koti_kbd.o\n' >> drivers/input/keyboard/Makefile
          tail -10 drivers/input/keyboard/Kconfig
          grep -n koti drivers/input/keyboard/Makefile

      # The OUTPUT twin of the driver above, and the reason CONFIG_VT is now on.
      # A VT needs a console driver to draw on, and koti's screen is character
      # cells in memory rather than a pixel buffer -- so this is a `struct
      # consw` in drivers/video/console/ alongside vgacon, NOT fbcon and not a
      # framebuffer. `depends on VT` because do_take_over_console() is the VT
      # layer's, and without VT the file would not compile.
      - name: Add koti's text console driver
        working-directory: linux-${{ env.KVER }}
        run: |
          cp ../sw/linux/koticon.c drivers/video/console/
          printf '\nconfig KOTICON\n\tbool "Koti-1 40x30 text console"\n\tdepends on VT\n\thelp\n\t  Console driver for koti'"'"'s character buffer (src/vga_text.sv).\n\t  Text mode, not a framebuffer: it writes 8-bit characters and the\n\t  font ROM in fabric renders them.\n' >> drivers/video/console/Kconfig
          printf 'obj-$(CONFIG_KOTICON)\t+= koticon.o\n' >> drivers/video/console/Makefile
          tail -10 drivers/video/console/Kconfig
          grep -n koti drivers/video/console/Makefile

      - name: Build the initramfs
        env:
          WHICH: ${{ inputs.initramfs || 'rootfs' }}
        run: |
          echo "initramfs: $WHICH"
          if [ "$WHICH" = "rootfs" ]; then
            python3 sw/linux/check_initramfs.py sw/linux/rootfs.cpio
            # A single .cpio is a supported value for CONFIG_INITRAMFS_SOURCE
            # and is embedded as-is; the .cpio suffix is what selects that path
            # (init/Kconfig), so the committed file must keep that name.
            echo "INITRAMFS=$PWD/sw/linux/rootfs.cpio" >> "$GITHUB_ENV"
          else
            riscv64-linux-gnu-gcc -march=rv32ima -mabi=ilp32 \
              -nostdlib -static -no-pie -Wl,--build-id=none \
              -o init sw/linux/init.S
            riscv64-linux-gnu-readelf -h init | grep -E 'Class|Type|Machine'
            cat > initramfs.desc <<EOF
          dir /dev 0755 0 0
          nod /dev/console 0600 0 0 c 5 1
          dir /proc 0755 0 0
          dir /sys 0755 0 0
          file /init $PWD/init 0755 0 0
          EOF
            cat initramfs.desc
            echo "INITRAMFS=$PWD/initramfs.desc" >> "$GITHUB_ENV"
          fi

      # init.S is built on EVERY run, whichever initramfs is embedded. It is
      # the fallback the `initramfs: init` input exists to reach, and a fallback
      # that has silently stopped compiling is not a fallback. This costs about
      # a second.
      - name: The stand-in initramfs still builds
        run: |
          riscv64-linux-gnu-gcc -march=rv32ima -mabi=ilp32 \
            -nostdlib -static -no-pie -Wl,--build-id=none \
            -o /tmp/init_standin sw/linux/init.S
          riscv64-linux-gnu-readelf -h /tmp/init_standin | grep -E 'Class|Machine'

      - name: Configure
        working-directory: linux-${{ env.KVER }}
        run: |
          cp ../sw/linux/koti_defconfig arch/riscv/configs/
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- koti_defconfig
          ./scripts/config --file .config \
            --set-str INITRAMFS_SOURCE "$INITRAMFS"
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # olddefconfig can drop a value whose dependencies are unmet, and an
          # empty INITRAMFS_SOURCE builds a kernel with an EMPTY initramfs that
          # boots perfectly and then panics with "No working init found" — a
          # failure that looks like userspace rather than like a build. Assert
          # the RESULT, which is the same lesson check_config.py exists for.
          got=$(sed -n 's/^CONFIG_INITRAMFS_SOURCE="\(.*\)"$/\1/p' .config)
          echo "CONFIG_INITRAMFS_SOURCE=$got"
          test "$got" = "$INITRAMFS"
          # Copied here and not after the build: the config is most wanted on
          # the runs that FAIL, and every step after this one can fail.
          cp .config config-koti.txt

      # A defconfig is a request. kconfig silently drops any line whose
      # dependencies are unmet, and three of the symbols koti depends on fail
      # by producing a kernel that boots and says nothing. Check the RESULT.
      - name: The resolved config is the kernel koti can run
        run: python3 sw/linux/check_config.py linux-${KVER}/.config

      - name: Build Image
        working-directory: linux-${{ env.KVER }}
        run: |
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            -j$(nproc) Image 2>&1 | tee build.log | tail -60
          ls -l arch/riscv/boot/Image

      # The header magic sw/sbi/sbi.c tests for, and whether the thing fits in
      # koti's 16 MB window at all.
      - name: The Image satisfies koti's boot contract
        run: python3 sw/linux/check_image.py linux-${KVER}/arch/riscv/boot/Image

      # check_config.py asserts the LEVER (CRYPTO_MANAGER_DISABLE_TESTS=y).
      # This asserts the EFFECT, and the two are not the same claim: the symbol
      # makes kbuild drop blake2s-selftest.o from the link entirely, so the
      # function vanishing from System.map is the observable that the self-test
      # is really gone.
      #
      # Guarding only the config symbol would be guarding a proxy — and a proxy
      # is precisely what failed here before. The old config looked completely
      # fine; the symbol simply did not exist, IS_ENABLED() was false, and the
      # self-test ran on every boot for >33 million clocks while nothing in the
      # build said a word. Two sessions read that silence as a hung machine.
      - name: The BLAKE2s self-test is really gone
        working-directory: linux-${{ env.KVER }}
        run: |
          if grep -qE ' blake2s_selftest$' System.map; then
            echo "::error::blake2s_selftest is still linked into the kernel."
            echo "It costs koti >33 million clocks at every boot and the boot"
            echo "had never got past it. CONFIG_CRYPTO must be y so that"
            echo "CONFIG_CRYPTO_MANAGER_DISABLE_TESTS (default y) exists at all."
            exit 1
          fi
          echo "blake2s_selftest: absent from System.map"

      # Where the bytes went. The first build of this kernel was 20.44 MiB
      # against 12 MiB of headroom, and `size vmlinux` explained none of it:
      # _etext was 1.8 MB and the rest was four 4 MiB SECTION_ALIGN gaps.
      # Gaps between consecutive symbols are what makes that visible, so the
      # next time this grows the answer is in the log rather than in a
      # download.
      - name: Sizes
        working-directory: linux-${{ env.KVER }}
        run: |
          riscv64-linux-gnu-size vmlinux || true
          echo "Image: $(stat -c %s arch/riscv/boot/Image) bytes"
          python3 - <<'PY'
          rows = []
          for line in open('System.map'):
              p = line.split(None, 2)
              if len(p) == 3:
                  rows.append((int(p[0], 16), p[2].strip()))
          rows.sort()
          gaps = sorted(((rows[i+1][0] - rows[i][0], rows[i][1])
                         for i in range(len(rows) - 1)), reverse=True)
          print(f"vmlinux spans {(rows[-1][0]-rows[0][0])/2**20:.2f} MiB")
          print("largest gaps after:")
          for size, name in gaps[:10]:
              print(f"  {size:>9}  {name}")
          PY

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-linux-Image
          path: |
            linux-${{ env.KVER }}/arch/riscv/boot/Image
            linux-${{ env.KVER }}/System.map
            linux-${{ env.KVER }}/config-koti.txt
            linux-${{ env.KVER }}/build.log

  # Boot the kernel that was just built, on the machine, and require it to say
  # so. This is the job that turns "a kernel exists" into "an OS runs" — and it
  # is a regression test for two core defects it found on the way there (the
  # AMO/TLB livelock in koti_core.sv and the dropped-request deadlock in
  # arbiter3.sv), neither of which any existing suite could reach.
  boot:
    needs: kernel
    # Null on a push, which is the point: a push always gets the 4-state engine
    # and this job's behaviour is unchanged by the `engine` input existing.
    if: ${{ inputs.engine == null || inputs.engine == '' || inputs.engine == 'iverilog' || inputs.engine == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/download-artifact@v7
        with:
          name: koti-linux-Image
          path: kimg

      - name: Build the boot bench
        run: |
          # vendor/*.sv is NOT optional: src/sd_ctrl.sv instantiates sd_spi, and
          # this bench defines KOTI_FPGA, so leaving it out is an elaboration
          # error rather than a missing feature. It was left out when the SD
          # rung landed and killed this bench — and therefore the standing
          # userspace gate — from 05430e7 until it was noticed.
          iverilog -g2012 -I src -DKOTI_SIMMEM \
            -o tb_boot.vvp src/*.sv vendor/sd_spi.sv vendor/spi_master.sv \
            test/sim_mem.sv test/tb_boot.v \
            2>&1 | grep -v "sorry:" || true
          test -f tb_boot.vvp

      - name: Boot Linux
        env:
          FULL: ${{ inputs.full || 'no' }}
          MAXCLK: ${{ inputs.maxclk }}
          QUIET: ${{ inputs.quiet }}
        run: |
          # pipefail, and it is load-bearing rather than hygiene. A `run:` step
          # with no `shell:` key executes under `bash -e {0}` — WITHOUT
          # pipefail — so in `vvp ... | tee boot.log` the pipeline's status is
          # tee's, and tee always succeeds. tb_boot's two hard-failure verdicts
          # ("nothing was printed", "halted without saying <marker>") end in
          # $fatal and vvp really does exit 1, and that 1 was being thrown away
          # here. Measured on this bench, not reasoned about: a $fatal vvp
          # gives exit 1 run directly and exit 0 run through `| tee`.
          #
          # The second verdict is the one that matters most: it exists
          # precisely to catch a kernel that dies on a WARN_ON/BUG_ON, and it
          # has never been able to turn this job red since the day it was
          # added.
          set -o pipefail
          python3 test/mkhex.py sw/sbi/sbi_sd.bin fw.hex
          python3 test/mkhex.py kimg/arch/riscv/boot/Image kernel.hex
          # ramoff = (0x0140_0000 - 0x0100_0000) / 4, the kernel's word offset
          # into the RAM window. Getting it wrong loads the kernel somewhere
          # the firmware will not find it, and the firmware then quietly runs
          # the flash payload instead — which prints, so the failure looks like
          # a working boot until you read what it said.
          # `inputs` is null on a push, so each of these falls back to the same
          # value the step used before it was made dispatchable.
          # Blank inputs resolve here rather than in the `default:` above,
          # because the budget depends on what the run is FOR and a default
          # cannot see that. A push (inputs null) gets the cheap partial boot.
          # ⚠️ 250M is NOT enough to reach userspace and is deliberately left
          # here anyway. Measured 2026-08-07: the marker arrives at 486,454,208
          # clocks with the real rootfs, so a 250M full run under THIS engine
          # ends INCOMPLETE having done nothing wrong. At ~29k clocks/s a real
          # 700M full boot is ~6.7 HOURS, past the 6-hour job limit, and even
          # 486M is ~4.7 hours. There is no honest default that both fits a job
          # and reaches a shell on iverilog — which is exactly why
          # boot-verilator exists. Pass +maxclk explicitly if a 4-state run to
          # userspace is genuinely what is wanted, and expect to wait.
          if [ "${FULL:-no}" = "yes" ]; then
            : "${MAXCLK:=250000000}"; : "${QUIET:=240000000}"
            echo "::warning::full=yes under iverilog: 250M clocks cannot reach \
          userspace (the marker is at ~486M) and 486M is ~4.7 hours at this \
          engine's speed. Use engine=verilator for the userspace claim."
          else
            # 32M, and the number is a MEASUREMENT that moved. This budget
            # has to cover the four greps below, the last of which is
            # `devtmpfs: initialized`. That used to arrive inside 20M clocks;
            # after PLAN.md item 12 doubled RAM to 32 MB it arrives between
            # 22M and 24M, because the kernel initialises twice the page
            # structs before it gets there. 20M went red on a machine that was
            # working perfectly (run 31265542722) and the full Verilator boot
            # passed in the same workflow, which is what identified it as a
            # budget rather than a defect.
            # ⚠️ THIS NUMBER IS TIED TO THE MEMORY SIZE. Grow RAM again and
            # re-measure it; the symptom of leaving it alone is a red gate with
            # a correct boot log that simply stops early.
            : "${MAXCLK:=32000000}"; : "${QUIET:=8000000}"
          fi
          echo "full=${FULL:-no} maxclk=$MAXCLK quiet=$QUIET"
          vvp tb_boot.vvp +flash=fw.hex +ram=kernel.hex +ramoff=1048576 \
            +maxclk=$MAXCLK \
            +quiet=$QUIET \
            +trace=${{ inputs.trace || '0' }} \
            +tfrom=${{ inputs.tfrom || '0' }} \
            +tlen=${{ inputs.tlen || '0' }} 2>&1 | tee boot.log

      # Grep for what only a real boot can produce. The banner alone would not
      # do: "Machine model" comes from koti.dts, so it also proves the firmware
      # found the blob in flash, copied it to RAM and passed it in a1, and that
      # the SBI console the kernel chose is the one this firmware implements.
      #
      # Skipped on a TRACED run, and that is not laziness. tb_boot writes
      # characters with $write (no newline) and trace lines with $display (with
      # one), so a trace line lands in the MIDDLE of whatever the kernel was
      # printing: "Linux ver[41000] fetch ...\nsion 6.12". Every grep below then
      # fails on a boot that was perfectly healthy, which is exactly what
      # happened to run 31031529894 — it went red while proving the machine was
      # fine. A diagnostic run is not a regression run, and a red badge that
      # means "you asked for a trace" trains people to ignore red badges.
      - name: It really booted
        if: ${{ (inputs.trace || '0') == '0' && (inputs.tlen || '0') == '0' }}
        run: |
          # The banner four: the machine was described, entered and heard from.
          grep -q "Linux version 6.12" boot.log
          grep -q "Machine model: Koti-1" boot.log
          grep -q "SBI specification v0.2 detected" boot.log
          grep -q "Kernel command line: console=hvc0 earlycon=sbi" boot.log

          # Ratcheted forward 2026-08-05. The four above all print at kernel
          # time 0.000000, so together they proved only that the kernel STARTED
          # — a machine that died immediately after the banner passed this job
          # for as long as it existed. Each line below is a subsystem that has
          # to have worked, and each was chosen because it is what the three CPU
          # defects found so far actually broke:
          #
          #   Calibrating delay loop   the SBI timer and the DTB's timebase
          #                            agree; lpj came from a real frequency
          #   Memory: .. available     the page allocator came up and mem_init
          #                            finished — the AMO/page-walk livelock
          #                            and the dropped-request deadlock both
          #                            died before here
          #   devtmpfs: initialized    driver model up, past the SLUB fast path
          #                            where the straddling fetch pair hung
          grep -q "Calibrating delay loop" boot.log
          grep -qE "Memory: .*available" boot.log
          grep -q "devtmpfs: initialized" boot.log

          # The CRNG is seeded, and this line is a PERFORMANCE assertion rather
          # than a security one. While crng_init is CRNG_EMPTY, crng_make_state()
          # runs a full extract_entropy() — a BLAKE2s hash of the whole input
          # pool — on EVERY random draw, and the kernel draws constantly. That
          # cost 34% of all machine time, measured on run 31038739162, and it is
          # what made the boot look stuck after the PLIC probe.
          #
          # The seed comes from /chosen/rng-seed in koti.dts and is credited
          # only because bootargs carry random.trust_bootloader=1, so this one
          # grep covers both. If it ever stops printing, the tax is back and the
          # only symptom is a boot that mysteriously got slower.
          grep -q "random: crng init done" boot.log
          echo "boot log: $(wc -l < boot.log) lines"

      # ---- the bench's own verdict, which nothing has ever read --------------
      # tb_boot decides PASS / INCOMPLETE / FAIL and prints it on the last line,
      # and until 2026-08-06 no step in this workflow looked at it. That left
      # the greps above as the only thing between a dead machine and a green
      # badge — and every one of them matches a line the kernel prints inside
      # its first 0.29 simulated seconds. INCOMPLETE ends with $finish, not
      # $fatal, so vvp exits 0 and the job goes green.
      #
      # This is not hypothetical and it is not old. Both runs dispatched on
      # 2026-08-05 to answer "does koti reach userspace?" are GREEN in the run
      # list and both ended INCOMPLETE, having never executed one userspace
      # instruction:
      #   31042403683  maxclk=70M — went silent after the PLIC probe at ~26.8M
      #                clocks and stayed silent for the whole 15M quiet window
      #   31045107094  maxclk=20M — hit the clock limit at "futex hash table
      #                entries", about 0.29 s of kernel time in
      #
      # Skipped on a traced run for the same reason the greps are, and the
      # reasoning there applies with more force here: a diagnostic run is
      # deliberately truncated, and a red badge meaning "you asked for a trace"
      # teaches people to ignore red badges. Exploring means asking for a
      # trace; a plain run is a regression run and must reach userspace.
      # It ALWAYS runs and ALWAYS prints the verdict, and it only FAILS when the
      # run declared `full: yes`. Those are two deliberate choices.
      #
      # Always printing, because the thing that went wrong here was not a wrong
      # threshold, it was that the verdict was invisible. A partial run's badge
      # cannot say "reached userspace" and must not be read as saying it, so on
      # a partial run this emits a NOTICE naming what was and was not checked.
      # Silence would recreate the defect at a different address.
      #
      # Only failing on a full run, because a partial run is truncated ON
      # PURPOSE and INCOMPLETE is its correct outcome. A gate that fails for the
      # expected outcome teaches people to ignore it — the same argument the
      # traced-run skip above is built on.
      - name: The bench's verdict
        if: ${{ (inputs.trace || '0') == '0' && (inputs.tlen || '0') == '0' }}
        env:
          FULL: ${{ inputs.full || 'no' }}
        run: |
          verdict=$(grep -E '^--- tb_boot: (PASS|INCOMPLETE|FAIL)' boot.log | tail -1)
          echo "bench verdict: ${verdict:-<no verdict line at all>}"
          case "$verdict" in
            *PASS*)
              echo "::notice::koti reached userspace: $verdict"
              exit 0 ;;
          esac
          if [ "${FULL:-no}" != "yes" ]; then
            echo "::notice::Partial boot (full=no). This run checked that the \
          kernel starts, times, allocates and brings up devtmpfs -- it did NOT \
          check that koti reaches userspace, and INCOMPLETE is its expected \
          outcome. Run this workflow with full=yes to check that claim."
            exit 0
          fi
          echo "::error::koti did not reach userspace. ${verdict:-tb_boot printed no verdict.}"
          echo "The marker the bench waits for is the one line that can only be"
          echo "printed by code running in user mode. Whatever else this log"
          echo "contains, execve has not happened. Last 15 lines:"
          tail -15 boot.log
          exit 1

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-boot-log
          path: boot.log

  # boot-verilator — the same bench, the same image, the same plusargs, a
  # different engine. ADDITIVE: it does not replace the `boot` job above.
  #
  # WHY. Reaching userspace is on the order of 1e8 clocks and iverilog does
  # ~25-29k clocks/s on this runner, so the run that answers the one open
  # question about this machine costs an hour and cannot be a push gate. That
  # is what forced `full` to be a declared opt-in — an honest split, but a
  # split that exists only because of simulator speed. test/tb_boot.v was
  # written as plain Verilog for exactly this reason and says so in its own
  # header: "so it runs under BOTH iverilog (for a short look) and Verilator
  # (for a whole kernel boot, which is tens of millions of clocks and out of
  # iverilog's reach)". The bench was ready; the workflow never used the other
  # engine.
  #
  # WHY IT DOES NOT REPLACE THE IVERILOG JOB, and must not until it has earned
  # it on the same image:
  #  - Verilator is 2-STATE. Every x becomes 0, so a defect that shows up as x
  #    propagation is invisible to it. That is not hypothetical here: the SDRAM
  #    read-window bug (2026-08-03) was FOUND as an x arriving in the top half
  #    of a captured word. An engine that cannot represent x cannot find that
  #    class of bug, however fast it is.
  #  - The `boot` job is the standing regression test for three CPU defects
  #    (the AMO/page-walk livelock, the dropped-request arbiter deadlock, the
  #    skipped second half of a straddling fetch pair). Swapping the engine
  #    under a gate like that on the strength of a speed number would be a bad
  #    trade at any speed.
  # So this job's first purpose is a MEASUREMENT — how many clocks/s, and does
  # it print the same boot as iverilog does — and it prints both.
  boot-verilator:
    needs: kernel
    # Runs on a push (inputs null) as well as on an explicit request, and on a
    # push it runs FULL — see the FULL default in the boot step. That is the
    # whole point of the speed: "koti reaches userspace" stops being a claim
    # someone remembers to check and becomes a gate that fails when it stops
    # being true.
    if: ${{ inputs.engine == null || inputs.engine == '' || inputs.engine == 'verilator' || inputs.engine == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # apt's verilator on ubuntu-24.04 is 5.020; the development host has
      # 5.051 inside oss-cad-suite. Printed rather than pinned, because the
      # version is the first thing to suspect if this job behaves differently
      # from a local run — and a --lint-only pass of this exact command on
      # 5.051 is what established, before any CI time was spent, that the
      # bench's hierarchical references (uut.core.pc_d, uut.halted) resolve
      # without --public-flat-rw and that nothing in src/ is unsupported.
      - name: Install verilator
        run: |
          sudo apt-get update && sudo apt-get install -y verilator
          verilator --version

      - uses: actions/download-artifact@v7
        with:
          name: koti-linux-Image
          path: kimg

      # -Wno-fatal, and it is not laziness: src/*.sv carries width warnings
      # that predate this job (plic.sv's rdata replicates, vga_text.sv's line
      # buffer index) and are not what this run is for. They are still PRINTED.
      # A lint gate on src/ is a separate piece of work with its own commit.
      #
      # --timescale, because tb_boot.v carries `timescale 1ns/1ps and the src/
      # modules do not, which Verilator reports as TIMESCALEMOD on every one of
      # them. Setting the default for modules without one removes ~20 warnings
      # that say nothing about this design.
      - name: Build the boot bench with Verilator
        run: |
          verilator --binary --timing -j 0 -Wno-fatal \
            --timescale 1ns/1ps \
            -Isrc -DKOTI_SIMMEM \
            --top-module tb_boot -o tb_boot_vl \
            src/*.sv vendor/sd_spi.sv vendor/spi_master.sv \
            test/sim_mem.sv test/tb_boot.v
          ls -l obj_dir/tb_boot_vl

      - name: Boot Linux under Verilator
        env:
          # 'yes' rather than 'no' when nothing is declared, and it is the one
          # place these two jobs deliberately DISAGREE. The iverilog job cannot
          # afford a full boot, so its silence means "partial"; this one can, so
          # its silence means "full". A push therefore gets both a 4-state
          # partial regression run and a required userspace claim.
          FULL: ${{ inputs.full || 'yes' }}
          MAXCLK: ${{ inputs.maxclk }}
          QUIET: ${{ inputs.quiet }}
        run: |
          # pipefail for the same load-bearing reason as the iverilog job: a
          # `run:` step with no `shell:` key is `bash -e {0}` WITHOUT it, so
          # `sim | tee log` reports tee's status and every $fatal is discarded.
          set -o pipefail
          python3 test/mkhex.py sw/sbi/sbi_sd.bin fw.hex
          python3 test/mkhex.py kimg/arch/riscv/boot/Image kernel.hex
          # 700M, from a measurement rather than a guess: the marker arrives at
          # 486,454,208 clocks with the committed rootfs (2026-08-07, and the
          # same boot reached it at 164,201,083 with initramfs=init). 700M is
          # ~1.4x that, about seven minutes here, and the simulation is
          # DETERMINISTIC for a given image, so the margin covers a growing
          # rootfs rather than run-to-run noise.
          #
          # "For a given image" is exact, not a hedge: the same rootfs built by
          # two different kernel builds gave 486,271,575 clocks in CI and
          # 486,454,208 on the development host — 0.04% apart, because the
          # kernel stamps its build date into the image and that moves what gets
          # compressed. Expect the last few digits to differ across builds and
          # nothing more.
          #
          # ⚠️ If this ever reports "clock limit reached", the first question is
          # whether the rootfs got bigger, not whether the machine broke. Raise
          # the budget deliberately and say what made it cost more.
          if [ "${FULL:-no}" = "yes" ]; then
            : "${MAXCLK:=700000000}"; : "${QUIET:=690000000}"
          else
            # 32M, and the number is a MEASUREMENT that moved. This budget
            # has to cover the four greps below, the last of which is
            # `devtmpfs: initialized`. That used to arrive inside 20M clocks;
            # after PLAN.md item 12 doubled RAM to 32 MB it arrives between
            # 22M and 24M, because the kernel initialises twice the page
            # structs before it gets there. 20M went red on a machine that was
            # working perfectly (run 31265542722) and the full Verilator boot
            # passed in the same workflow, which is what identified it as a
            # budget rather than a defect.
            # ⚠️ THIS NUMBER IS TIED TO THE MEMORY SIZE. Grow RAM again and
            # re-measure it; the symptom of leaving it alone is a red gate with
            # a correct boot log that simply stops early.
            : "${MAXCLK:=32000000}"; : "${QUIET:=8000000}"
          fi
          echo "full=${FULL:-no} maxclk=$MAXCLK quiet=$QUIET (verilator)"
          t0=$(date +%s)
          # `|| rc=$?` rather than letting the step die here, so that a run
          # which ends in $fatal still REPORTS its speed. The whole point of
          # this job is a number, and the runs most worth measuring are the
          # ones that end badly.
          rc=0
          ./obj_dir/tb_boot_vl +flash=fw.hex +ram=kernel.hex +ramoff=1048576 \
            +maxclk=$MAXCLK \
            +quiet=$QUIET \
            +trace=${{ inputs.trace || '0' }} \
            +tfrom=${{ inputs.tfrom || '0' }} \
            +tlen=${{ inputs.tlen || '0' }} 2>&1 | tee boot-vl.log || rc=$?
          t1=$(date +%s)
          # The number this job exists to produce. Printed even on a red run,
          # because a run that failed for an engine reason still measured the
          # engine.
          echo "elapsed=$((t1 - t0))s" | tee -a speed.txt
          clocks=$(sed -n 's/^--- \([0-9]*\) clocks.*/\1/p' boot-vl.log | tail -1)
          if [ -n "$clocks" ] && [ "$((t1 - t0))" -gt 0 ]; then
            echo "clocks=$clocks rate=$((clocks / (t1 - t0))) clocks/s" | tee -a speed.txt
            echo "::notice::verilator: $clocks clocks in $((t1 - t0))s = \
          $((clocks / (t1 - t0))) clocks/s. iverilog does ~25-29k clocks/s on \
          this runner."
          fi
          exit $rc

      # The same greps as the iverilog job, for a different reason: there they
      # ask "did the machine boot", here they ask "does this engine print the
      # SAME boot". A Verilator run that reaches userspace while dropping a
      # subsystem's line has not agreed with iverilog, and the speed number
      # would be worthless.
      - name: It really booted, under Verilator too
        if: ${{ (inputs.trace || '0') == '0' && (inputs.tlen || '0') == '0' }}
        run: |
          grep -q "Linux version 6.12" boot-vl.log
          grep -q "Machine model: Koti-1" boot-vl.log
          grep -q "SBI specification v0.2 detected" boot-vl.log
          grep -q "Kernel command line: console=hvc0 earlycon=sbi" boot-vl.log
          grep -q "Calibrating delay loop" boot-vl.log
          grep -qE "Memory: .*available" boot-vl.log
          grep -q "devtmpfs: initialized" boot-vl.log
          grep -q "random: crng init done" boot-vl.log
          echo "boot log: $(wc -l < boot-vl.log) lines"

      # Same rule as the iverilog job: always print the verdict, only fail on a
      # declared full run. A partial Verilator run is truncated on purpose and
      # INCOMPLETE is its correct outcome.
      - name: The bench's verdict, under Verilator
        if: ${{ (inputs.trace || '0') == '0' && (inputs.tlen || '0') == '0' }}
        env:
          FULL: ${{ inputs.full || 'no' }}
        run: |
          verdict=$(grep -E '^--- tb_boot: (PASS|INCOMPLETE|FAIL)' boot-vl.log | tail -1)
          echo "bench verdict (verilator): ${verdict:-<no verdict line at all>}"
          case "$verdict" in
            *PASS*)
              echo "::notice::verilator: koti reached userspace: $verdict"
              exit 0 ;;
          esac
          if [ "${FULL:-no}" != "yes" ]; then
            echo "::notice::Partial boot (full=no) under Verilator. INCOMPLETE \
          is its expected outcome; this run is a speed and agreement \
          measurement, not a userspace claim."
            exit 0
          fi
          echo "::error::verilator: koti did not reach userspace. \
          ${verdict:-tb_boot printed no verdict.}"
          tail -15 boot-vl.log
          exit 1

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-boot-log-verilator
          path: |
            boot-vl.log
            speed.txt
