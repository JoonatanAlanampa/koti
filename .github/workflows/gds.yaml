name: gds

# MANUAL ONLY, on purpose. Koti's Linux is an FPGA target and is not going to a
# shuttle (user directive 2026-08-02, see PLAN.md), so the 8x2 harden is parked:
# it is red on PDN-0233, it needs the DFFRAM regfile macro that nobody is going
# to generate, and it takes tens of minutes. Running it on every push spent CI
# on a question nothing is waiting for and painted a red X on unrelated work.
#
# Deliberately NOT deleted. Koti-1-as-a-chip is parked, not cancelled — if that
# reopens, `gh workflow run gds.yaml` still does exactly what it always did.
on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
