# linux — build the kernel koti is supposed to boot, and the machine
# description it is handed.
#
# This runs in CI and not on the development host for two reasons: it is a
# multi-gigabyte source tree and a ten-minute build, and the host's RISC-V
# compiler (xpack riscv-none-elf, used by sw/build.py) is a bare-metal newlib
# toolchain that cannot build a kernel at all.
#
# It deliberately does NOT use Buildroot, which is the usual answer to
# "I need a riscv32-linux toolchain". Buildroot's value is that it builds a
# libc and a userspace; the kernel is freestanding and links no libc, so
# Ubuntu's stock `gcc-riscv64-linux-gnu` builds it directly once told
# `-march=rv32ima -mabi=ilp32` — which the kernel's own Makefile does from
# CONFIG_ARCH_RV32I. That turns a 40-minute cold build with a large surface of
# things that can go wrong into a ~10-minute one, which matters when every
# debug round trip has to happen in CI. Buildroot comes back at the point
# koti wants a real userspace (busybox, a shell) rather than the one-program
# initramfs below.
name: linux
on:
  push:
    # The `boot` job below is the standing regression test for two CPU defects
    # that live in src/ — the AMO/page-walk livelock in koti_core.sv and the
    # dropped-request deadlock in arbiter3.sv — and until 2026-08-04 this
    # workflow did not trigger on src/ at all. A change to either file would
    # have gone green on all four other workflows while silently reintroducing
    # a hang that no other suite can reach. The commit that fixed the AMO
    # livelock only ran this workflow because it happened to touch
    # sw/linux/README.md in the same commit; that was luck, not coverage.
    #
    # So the trigger list is now everything the `boot` job actually consumes.
    # The whole workflow runs rather than just `boot`, because `boot` needs the
    # Image that `kernel` builds; on a public repo the runner minutes are free
    # and ~15 minutes is cheap against the failure mode, which is a machine
    # that hangs on real hardware with a blank console.
    paths:
      - 'sw/linux/**'
      - 'src/**'                       # the machine the kernel boots on
      - 'sw/sbi/**'                    # the firmware that enters it
      - 'test/tb_boot.v'               # the bench
      - 'test/sim_mem.sv'              # and its memory model
      - 'test/mkhex.py'                # how the images are loaded
      - '.github/workflows/linux.yaml'
  # Boot experiments are dispatchable, because this runner is about five times
  # faster at the boot bench than the development host (~29k simulated clocks
  # per second against ~5-6k), and a boot that has to be chased past where the
  # default limits stop is exactly the case where that matters. The defaults
  # below are the values a push uses, so a push is unchanged.
  workflow_dispatch:
    inputs:
      # Raised 15M -> 20M 2026-08-05, to buy margin for the assertions below
      # rather than for its own sake. At 15M "devtmpfs: initialized" was the
      # LAST line printed, arriving with almost nothing to spare, so asserting
      # it would have turned any 5% slowdown into a red run that meant nothing.
      # 20M leaves about a third in hand. It costs ~3 minutes a push, against a
      # failure mode of a machine that hangs on real hardware with a blank
      # console. Deeper coverage is a workflow_dispatch away.
      maxclk:
        description: 'boot: give up after this many clocks'
        default: '20000000'
      # ⚠️ RAISED 4M -> 8M 2026-08-05, because 4M had become WRONG rather than
      # merely tight. The BLAKE2s self-test (blake2s_mod_init, a device_initcall
      # two entries after the io schedulers) hashes 256 test vectors and prints
      # NOTHING while it does, which on this machine is a legitimate silence of
      # roughly 5M clocks. Any run whose maxclk reaches ~27M therefore hit the
      # 4M window mid-self-test and reported "assuming stuck" about a kernel
      # that was working perfectly. This project has already lost a day to that
      # exact verdict once, from the same window at a different clock.
      quiet:
        description: 'boot: give up after this many clocks with no output'
        default: '8000000'
      trace:
        description: 'boot: print the fetch PC every N clocks (0 = off)'
        default: '0'
      # The coarse trace above answers "what is it doing"; these answer "what is
      # the loop", which is the only resolution at which a stuck instruction
      # explains itself. tb_boot.v has supported both since it was written and
      # the workflow simply never passed them on, so reaching for them meant
      # editing this file — in the middle of a debugging session, which is
      # exactly when nobody wants to.
      tfrom:
        description: 'boot: start the per-clock trace at this clock'
        default: '0'
      tlen:
        description: 'boot: per-clock trace length, in clocks (0 = off)'
        default: '0'

env:
  # Pinned, not "latest": the kernel config in sw/linux/koti_defconfig was
  # written against this version's Kconfig (RISCV_SBI_V01, NONPORTABLE,
  # ARCH_RV32I), and sw/linux/check_config.py asserts the symbols still
  # resolve. Bumping this is a deliberate act with a checklist, not a default.
  KVER: '6.12'

jobs:
  # Fast job, kept separate on purpose: the devicetree blob is what
  # sw/sbi/dtb.S embeds in flash, and waiting ten minutes behind a kernel
  # build to regenerate a 2 KB file is not a loop anyone will use.
  dtb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      # Warnings are failures here for the same reason as in test.yaml: dtc
      # exits 0 on a warning, and a devicetree is read once, early, by exactly
      # one consumer, with no console up yet.
      - name: Compile koti.dts
        run: |
          dtc -I dts -O dtb -o koti.dtb sw/linux/koti.dts 2>dtc.log
          cat dtc.log
          ! grep -q Warning dtc.log
          ls -l koti.dtb

      # Uploaded BEFORE it is compared, so that the run which tells you the
      # committed blob is stale is also the run you get the fresh one from.
      - uses: actions/upload-artifact@v7
        with:
          name: koti-dtb
          path: koti.dtb

      # The committed blob is what actually ships inside sbi_test.bin, so it
      # has to still mean the same thing as the .dts next to it. Compared
      # through `dtc -I dtb -O dts` rather than byte for byte, so a dtc
      # version bump that changes padding does not read as a stale blob.
      - name: The committed blob still matches the source
        run: |
          stale() {
            echo
            echo "sw/linux/koti.dtb does not match sw/linux/koti.dts."
            echo "Download the koti-dtb artifact from this run, commit it as"
            echo "sw/linux/koti.dtb, and rebuild the firmware"
            echo "(python sw/sbi/build.py) so sbi_test.bin carries the new"
            echo "blob at flash 0x6000."
            exit 1
          }
          test -f sw/linux/koti.dtb || { echo "no committed blob"; stale; }
          dtc -I dtb -O dts -o fresh.dts koti.dtb 2>/dev/null
          dtc -I dtb -O dts -o committed.dts sw/linux/koti.dtb 2>/dev/null
          diff -u committed.dts fresh.dts || stale

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio kmod rsync xz-utils
          riscv64-linux-gnu-gcc --version | head -1

      # The compiler is a riscv64 one. Prove it can emit the 32-bit soft-float
      # code this kernel needs BEFORE spending ten minutes finding out in the
      # middle of a build, and prove it as ELF32 rather than by trusting that
      # -march was accepted.
      - name: The riscv64 compiler really emits rv32
        run: |
          echo 'int f(int x){return x*3;}' > /tmp/t.c
          riscv64-linux-gnu-gcc -march=rv32ima_zicsr_zifencei -mabi=ilp32 \
            -ffreestanding -nostdlib -c /tmp/t.c -o /tmp/t.o
          riscv64-linux-gnu-readelf -h /tmp/t.o | grep -E 'Class|Machine'
          riscv64-linux-gnu-readelf -h /tmp/t.o | grep -q ELF32

      - name: Cache the kernel tarball
        id: tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ env.KVER }}.tar.xz
          key: linux-tarball-${{ env.KVER }}

      - name: Fetch the kernel
        if: steps.tarball.outputs.cache-hit != 'true'
        run: |
          curl -fL -o linux-${KVER}.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz

      - name: Unpack
        run: tar xf linux-${KVER}.tar.xz

      # /init, and the /dev/console node without which it would run with no
      # file descriptors and print nothing. gen_init_cpio makes the device
      # node from this description without needing root.
      - name: Build the one-program initramfs
        run: |
          riscv64-linux-gnu-gcc -march=rv32ima -mabi=ilp32 \
            -nostdlib -static -no-pie -Wl,--build-id=none \
            -o init sw/linux/init.S
          riscv64-linux-gnu-readelf -h init | grep -E 'Class|Type|Machine'
          cat > initramfs.desc <<EOF
          dir /dev 0755 0 0
          nod /dev/console 0600 0 0 c 5 1
          dir /proc 0755 0 0
          dir /sys 0755 0 0
          file /init $PWD/init 0755 0 0
          EOF
          cat initramfs.desc

      - name: Configure
        working-directory: linux-${{ env.KVER }}
        run: |
          cp ../sw/linux/koti_defconfig arch/riscv/configs/
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- koti_defconfig
          ./scripts/config --file .config \
            --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/initramfs.desc"
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          # Copied here and not after the build: the config is most wanted on
          # the runs that FAIL, and every step after this one can fail.
          cp .config config-koti.txt

      # A defconfig is a request. kconfig silently drops any line whose
      # dependencies are unmet, and three of the symbols koti depends on fail
      # by producing a kernel that boots and says nothing. Check the RESULT.
      - name: The resolved config is the kernel koti can run
        run: python3 sw/linux/check_config.py linux-${KVER}/.config

      - name: Build Image
        working-directory: linux-${{ env.KVER }}
        run: |
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- \
            -j$(nproc) Image 2>&1 | tee build.log | tail -60
          ls -l arch/riscv/boot/Image

      # The header magic sw/sbi/sbi.c tests for, and whether the thing fits in
      # koti's 16 MB window at all.
      - name: The Image satisfies koti's boot contract
        run: python3 sw/linux/check_image.py linux-${KVER}/arch/riscv/boot/Image

      # check_config.py asserts the LEVER (CRYPTO_MANAGER_DISABLE_TESTS=y).
      # This asserts the EFFECT, and the two are not the same claim: the symbol
      # makes kbuild drop blake2s-selftest.o from the link entirely, so the
      # function vanishing from System.map is the observable that the self-test
      # is really gone.
      #
      # Guarding only the config symbol would be guarding a proxy — and a proxy
      # is precisely what failed here before. The old config looked completely
      # fine; the symbol simply did not exist, IS_ENABLED() was false, and the
      # self-test ran on every boot for >33 million clocks while nothing in the
      # build said a word. Two sessions read that silence as a hung machine.
      - name: The BLAKE2s self-test is really gone
        working-directory: linux-${{ env.KVER }}
        run: |
          if grep -qE ' blake2s_selftest$' System.map; then
            echo "::error::blake2s_selftest is still linked into the kernel."
            echo "It costs koti >33 million clocks at every boot and the boot"
            echo "had never got past it. CONFIG_CRYPTO must be y so that"
            echo "CONFIG_CRYPTO_MANAGER_DISABLE_TESTS (default y) exists at all."
            exit 1
          fi
          echo "blake2s_selftest: absent from System.map"

      # Where the bytes went. The first build of this kernel was 20.44 MiB
      # against 12 MiB of headroom, and `size vmlinux` explained none of it:
      # _etext was 1.8 MB and the rest was four 4 MiB SECTION_ALIGN gaps.
      # Gaps between consecutive symbols are what makes that visible, so the
      # next time this grows the answer is in the log rather than in a
      # download.
      - name: Sizes
        working-directory: linux-${{ env.KVER }}
        run: |
          riscv64-linux-gnu-size vmlinux || true
          echo "Image: $(stat -c %s arch/riscv/boot/Image) bytes"
          python3 - <<'PY'
          rows = []
          for line in open('System.map'):
              p = line.split(None, 2)
              if len(p) == 3:
                  rows.append((int(p[0], 16), p[2].strip()))
          rows.sort()
          gaps = sorted(((rows[i+1][0] - rows[i][0], rows[i][1])
                         for i in range(len(rows) - 1)), reverse=True)
          print(f"vmlinux spans {(rows[-1][0]-rows[0][0])/2**20:.2f} MiB")
          print("largest gaps after:")
          for size, name in gaps[:10]:
              print(f"  {size:>9}  {name}")
          PY

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-linux-Image
          path: |
            linux-${{ env.KVER }}/arch/riscv/boot/Image
            linux-${{ env.KVER }}/System.map
            linux-${{ env.KVER }}/config-koti.txt
            linux-${{ env.KVER }}/build.log

  # Boot the kernel that was just built, on the machine, and require it to say
  # so. This is the job that turns "a kernel exists" into "an OS runs" — and it
  # is a regression test for two core defects it found on the way there (the
  # AMO/TLB livelock in koti_core.sv and the dropped-request deadlock in
  # arbiter3.sv), neither of which any existing suite could reach.
  boot:
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/download-artifact@v7
        with:
          name: koti-linux-Image
          path: kimg

      - name: Build the boot bench
        run: |
          iverilog -g2012 -I src -DKOTI_FPGA -DKOTI_SIMMEM \
            -o tb_boot.vvp src/*.sv test/sim_mem.sv test/tb_boot.v \
            2>&1 | grep -v "sorry:" || true
          test -f tb_boot.vvp

      - name: Boot Linux
        run: |
          python3 test/mkhex.py sw/sbi/sbi_test.bin fw.hex
          python3 test/mkhex.py kimg/arch/riscv/boot/Image kernel.hex
          # ramoff = (0x0140_0000 - 0x0100_0000) / 4, the kernel's word offset
          # into the RAM window. Getting it wrong loads the kernel somewhere
          # the firmware will not find it, and the firmware then quietly runs
          # the flash payload instead — which prints, so the failure looks like
          # a working boot until you read what it said.
          # `inputs` is null on a push, so each of these falls back to the same
          # value the step used before it was made dispatchable.
          vvp tb_boot.vvp +flash=fw.hex +ram=kernel.hex +ramoff=1048576 \
            +maxclk=${{ inputs.maxclk || '20000000' }} \
            +quiet=${{ inputs.quiet || '8000000' }} \
            +trace=${{ inputs.trace || '0' }} \
            +tfrom=${{ inputs.tfrom || '0' }} \
            +tlen=${{ inputs.tlen || '0' }} 2>&1 | tee boot.log

      # Grep for what only a real boot can produce. The banner alone would not
      # do: "Machine model" comes from koti.dts, so it also proves the firmware
      # found the blob in flash, copied it to RAM and passed it in a1, and that
      # the SBI console the kernel chose is the one this firmware implements.
      #
      # Skipped on a TRACED run, and that is not laziness. tb_boot writes
      # characters with $write (no newline) and trace lines with $display (with
      # one), so a trace line lands in the MIDDLE of whatever the kernel was
      # printing: "Linux ver[41000] fetch ...\nsion 6.12". Every grep below then
      # fails on a boot that was perfectly healthy, which is exactly what
      # happened to run 31031529894 — it went red while proving the machine was
      # fine. A diagnostic run is not a regression run, and a red badge that
      # means "you asked for a trace" trains people to ignore red badges.
      - name: It really booted
        if: ${{ (inputs.trace || '0') == '0' && (inputs.tlen || '0') == '0' }}
        run: |
          # The banner four: the machine was described, entered and heard from.
          grep -q "Linux version 6.12" boot.log
          grep -q "Machine model: Koti-1" boot.log
          grep -q "SBI specification v0.2 detected" boot.log
          grep -q "Kernel command line: console=hvc0 earlycon=sbi" boot.log

          # Ratcheted forward 2026-08-05. The four above all print at kernel
          # time 0.000000, so together they proved only that the kernel STARTED
          # — a machine that died immediately after the banner passed this job
          # for as long as it existed. Each line below is a subsystem that has
          # to have worked, and each was chosen because it is what the three CPU
          # defects found so far actually broke:
          #
          #   Calibrating delay loop   the SBI timer and the DTB's timebase
          #                            agree; lpj came from a real frequency
          #   Memory: .. available     the page allocator came up and mem_init
          #                            finished — the AMO/page-walk livelock
          #                            and the dropped-request deadlock both
          #                            died before here
          #   devtmpfs: initialized    driver model up, past the SLUB fast path
          #                            where the straddling fetch pair hung
          grep -q "Calibrating delay loop" boot.log
          grep -qE "Memory: .*available" boot.log
          grep -q "devtmpfs: initialized" boot.log
          echo "boot log: $(wc -l < boot.log) lines"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-boot-log
          path: boot.log
