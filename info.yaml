# Tiny Tapeout project information
project:
  title:        "Koti-1 (headless v1)"
  author:       "Joonatan Alanampa"
  discord:      ""
  description:  "RV32IMA + Zicsr Linux-track SoC: QSPI XIP, CLINT timer, UART. VGA/PS2 to come."
  language:     "SystemVerilog"
  clock_hz:     25000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_koti"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.sv"
    - "koti_core.sv"
    - "qspi_ctrl.sv"
    - "clint.sv"
    - "vga_text.sv"
    - "vga_timing.sv"
    - "ps2_rx.sv"
    - "arbiter3.sv"
    - "control.sv"
    - "alu.sv"
    - "branch.sv"
    - "immgen.sv"
    - "regfile.sv"
    - "muldiv.sv"
    - "csr.sv"
    - "tlb.sv"
    - "uart_tx.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (GPIO in, MMIO 0x10008; PS/2 takes ui[1:0] with the video milestone)
  ui[0]: "GPIO0"
  ui[1]: "GPIO1"
  ui[2]: "GPIO2"
  ui[3]: "GPIO3"
  ui[4]: "GPIO4"
  ui[5]: "GPIO5"
  ui[6]: "GPIO6"
  ui[7]: "GPIO7"

  # Outputs (headless v1; Tiny VGA takes uo with the video milestone)
  uo[0]: "UART_TX"
  uo[1]: "HALTED"
  uo[2]: "LED0"
  uo[3]: "LED1"
  uo[4]: "LED2"
  uo[5]: "LED3"
  uo[6]: "LED4"
  uo[7]: "LED5"

  # Bidirectional pins (TinyTapeout QSPI Pmod standard)
  uio[0]: "CS0_FLASH"
  uio[1]: "SD0_MOSI"
  uio[2]: "SD1_MISO"
  uio[3]: "SCK"
  uio[4]: "SD2"
  uio[5]: "SD3"
  uio[6]: "CS1_PSRAM"
  uio[7]: "CS2"

# Do not change!
yaml_version: 6
