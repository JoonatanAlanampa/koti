name: core-tests

on: [push, workflow_dispatch]

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install cocotb
        run: pip install "cocotb>=2.0"

      # ⛔ FIRST, because it is the cheapest check in the repo and it guards a
      # failure that is silent in the worst direction. fpga-ulx3s.yaml does not
      # compile the firmware — it packs sw/$img.bin off disk — so editing a .c
      # without rebuilding produces a green run, a valid bitstream, and a board
      # running the OLD code. That happened on 2026-08-11 and cost a bitstream
      # build and a flash cycle to notice. No toolchain needed: it compares the
      # recorded source hashes, not a rebuild.
      - name: firmware binaries match the sources beside them
        run: python sw/check_firmware.py

      # ⚠️ A LINT, and a weak one by construction — see the file's own header.
      # It cannot tell whether a driver works. It pins constructs that already
      # cost a bench session, because the thing that would really prove these
      # drivers is opening their device nodes on a booted machine, and no gate
      # in this repo does that.
      - name: drivers carry no known-wrong constructs
        run: python sw/linux/check_drivers.py

      # ⛔ THE ROOTFS SHELL HAD NEVER BEEN EXECUTED BY ANYTHING. check_rootfs.py
      # checks Buildroot symbols and check_initramfs.py checks that the cpio
      # matches the overlay — neither runs a line of it. So `koti-net`, which
      # decides what year the machine thinks it is out of a string parsed off a
      # wire that corrupts its first byte, reached the card as a green build
      # nobody had run. The first execution of that parser found a real defect
      # (day and year swapped, so every good Date header was refused as
      # implausible), and the round trip that would otherwise have found it is
      # ~70 minutes plus a card shuffle.
      #
      # ⚠️ busybox, not bash: koti's shell is busybox ash, and `$((08))` is an
      # octal literal there and an error — a bug that would surface on two
      # hours out of twenty-four. Testing under the shell we ship to is the
      # whole point; -n keeps it honest about what it cannot cover.
      - name: install busybox (koti's actual shell)
        run: sudo apt-get install -y busybox-static

      - name: rootfs shell scripts parse under busybox ash
        run: |
          for f in sw/linux/rootfs-overlay/init \
                   sw/linux/rootfs-overlay/etc/init.d/S45kotisd \
                   sw/linux/rootfs-overlay/etc/init.d/S99koti \
                   sw/linux/rootfs-overlay/etc/profile.d/10-koti.sh \
                   sw/linux/rootfs-overlay/usr/bin/koti \
                   sw/linux/rootfs-overlay/usr/bin/koti-net \
                   sw/linux/rootfs-overlay/usr/bin/koti-help \
                   sw/linux/rootfs-overlay/usr/bin/koti-status; do
            echo "-- $f"
            busybox sh -n "$f"
          done

      - name: rootfs shell unit tests (clock parser, mount rules)
        run: busybox sh sw/linux/test_rootfs_shell.sh

      - name: muldiv unit tests
        run: python run_core.py
        working-directory: test

      - name: instruction-level pipeline tests
        run: python run_cpu.py
        working-directory: test

      - name: official riscv-tests (rv32ui+um+ua, prebuilt bins)
        run: python run_riscv.py
        working-directory: test
