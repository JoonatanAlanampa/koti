# userspace — build the rootfs koti's kernel boots into.
#
# Ladder item 7: a real userspace. sw/linux/init.S is a ~20-instruction stand-in
# that prints one line and asks for power-off; it proves execve works and
# nothing more. A machine you can USE needs a shell, and a shell needs a libc,
# and a libc for rv32 is the one thing Ubuntu's cross-toolchain does not ship.
# That is the whole reason .github/workflows/linux.yaml can avoid Buildroot for
# the kernel — freestanding, links no libc — and cannot avoid it here.
#
# SEPARATE WORKFLOW, AND THE CPIO IS COMMITTED. Buildroot builds an entire
# toolchain from source: roughly forty minutes cold. Putting that in front of
# every push to src/ would make the CPU regression loop unusable. So this runs
# on demand, and its output is committed as sw/linux/rootfs.cpio the same way
# sw/linux/koti.dtb and sw/sbi/sbi_test.bin already are — build products that
# need a tool the ordinary path does not have. linux.yaml then just consumes
# the committed file.
#
# ⚠️ The base is an IN-TREE defconfig plus a small fragment, not a hand-written
# defconfig. A from-scratch Buildroot config for a niche target is a long list
# of symbols nobody can verify without running the build, and Buildroot drops
# unmet symbols silently. Starting from a config that already builds and
# overriding only what koti requires keeps the surface small — and
# sw/linux/check_rootfs.py then checks the RESULT rather than the request.
name: userspace

on:
  workflow_dispatch:
    inputs:
      brver:
        description: 'Buildroot git tag to build'
        default: '2025.02.4'
  push:
    paths:
      - 'sw/linux/buildroot_koti.fragment'
      - 'sw/linux/check_rootfs.py'
      - '.github/workflows/userspace.yaml'
      # ⚠️ The overlay is BAKED INTO the rootfs, so a change here is a change to
      # the artifact — and /init lives in it, which is the first thing the
      # kernel executes. Without this line an overlay-only edit leaves the
      # committed cpio stale: check_initramfs.py would catch it later, in
      # `linux`, as a confusing failure about a file nobody had just touched.
      - 'sw/linux/rootfs-overlay/**'
      # post-build.sh appends the tty1 getty to the generated inittab, so it is
      # part of the artifact for exactly the same reason the overlay is. Without
      # this line, editing it alone leaves the committed cpio stale and the
      # screen has no login on it, with nothing pointing at the cause.
      - 'sw/linux/post-build.sh'

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Buildroot's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            cpio rsync unzip wget file python3 git

      # Pinned to a tag, not a branch: a userspace is a thing you reproduce.
      # A tag that does not exist fails here in seconds rather than after the
      # forty-minute build, which is why the clone comes before anything else.
      - name: Fetch Buildroot
        env:
          BRVER: ${{ inputs.brver || '2025.02.4' }}
        run: |
          git clone --depth 1 --branch "$BRVER" \
            https://gitlab.com/buildroot.org/buildroot.git buildroot
          echo "buildroot $BRVER"

      # Buildroot re-downloads every package source on a cold run. The tarballs
      # are the slow, flaky part; the compile is merely slow.
      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ inputs.brver || '2025.02.4' }}-${{ hashFiles('sw/linux/buildroot_koti.fragment') }}
          restore-keys: |
            buildroot-dl-${{ inputs.brver || '2025.02.4' }}-
            buildroot-dl-

      # ⚠️ CHECKED BEFORE THE BUILD, because Buildroot does not fail on this.
      # A post-build script without the executable bit produces:
      #     >>>   Executing post-build script ../sw/linux/post-build.sh
      #     /bin/bash: line 1: ../sw/linux/post-build.sh: Permission denied
      # and then `make` still exits 0. The rootfs.ext2 appears, the CPIO does
      # NOT, and the failure surfaces forty minutes later as a missing file in
      # an unrelated step. It happened on run 31275755900: the file was authored
      # on Windows, where git records mode 100644 unless told otherwise
      # (`git update-index --chmod=+x`).
      - name: the post-build script can actually be executed
        run: |
          test -x sw/linux/post-build.sh || {
            echo "::error::sw/linux/post-build.sh is not executable. Buildroot           will print 'Permission denied', carry on, and silently produce no           rootfs.cpio. Fix with: git update-index --chmod=+x sw/linux/post-build.sh"
            exit 1; }
          echo "post-build.sh is executable"

      - name: Configure
        working-directory: buildroot
        run: |
          make qemu_riscv32_virt_defconfig
          cat ../sw/linux/buildroot_koti.fragment >> .config
          make olddefconfig
          cp .config ../buildroot-config.txt

      # BEFORE the forty-minute build, not after. Every symbol checked here is
      # one that produces a rootfs koti cannot run, and finding that out at the
      # end of the build costs the whole build.
      - name: The resolved config is a userspace koti can run
        run: python3 sw/linux/check_rootfs.py --config-only buildroot-config.txt

      - name: Build the rootfs
        working-directory: buildroot
        run: make -j$(nproc) 2>&1 | tail -80

      # The claim that matters, and it is about the BINARIES rather than the
      # build system that produced them: ELF32, RISC-V, and e_flags == 0, which
      # means no compressed instructions and no hardware float ABI. koti's
      # decoder has neither. A rootfs that fails this boots a perfectly healthy
      # kernel straight into an illegal instruction at execve.
      - name: The binaries are ones koti can execute
        run: |
          mapfile -t bins < <(find buildroot/output/target -type f \
            \( -path '*/bin/*' -o -path '*/sbin/*' -o -name '*.so*' \) | head -200)
          echo "checking ${#bins[@]} files"
          python3 sw/linux/check_rootfs.py \
            --cpio buildroot/output/images/rootfs.cpio \
            buildroot-config.txt "${bins[@]}"

      # The overlay reached the rootfs, and the marker string inside it is the
      # one the bench waits for. check_rootfs.py asserts BR2_ROOTFS_OVERLAY is
      # spelled right; this asserts the file actually arrived and still says
      # what test/tb_boot.v expects. The two are different claims — a correct
      # symbol with a wrong path silently produces a rootfs with no marker, and
      # the only symptom would be every boot reporting INCOMPLETE forever.
      - name: The boot marker is in the rootfs
        run: |
          f=buildroot/output/target/etc/init.d/S99koti
          test -x "$f" || { echo "::error::$f missing or not executable — did BR2_ROOTFS_OVERLAY apply?"; exit 1; }
          marker=$(sed -n 's/.*localparam \[8\*MARKLEN-1:0\] MARKER = "\(.*\)";/\1/p' test/tb_boot.v)
          test -n "$marker" || { echo "::error::could not read MARKER out of test/tb_boot.v"; exit 1; }
          echo "bench expects: $marker"
          grep -qF "$marker" "$f" || { echo "::error::S99koti does not print the string tb_boot.v waits for"; exit 1; }
          echo "marker present in the rootfs"

      # The record `linux` checks the committed cpio against, written here
      # beside the archive it describes so both land in the same artifact and
      # get committed together. A cpio committed with a stale record, or a
      # record committed without its cpio, is exactly the drift this exists to
      # catch — so they are produced as a pair and never by hand.
      #
      # Then the pair is verified HERE, with the same script `linux` will run,
      # against the files as they would be committed. A check that first
      # executes in the workflow that consumes the artifact is a check whose
      # first run is on someone else's push.
      - name: Record what built this rootfs, and verify the pair
        run: |
          cp buildroot/output/images/rootfs.cpio sw/linux/rootfs.cpio
          python3 sw/linux/check_initramfs.py sw/linux/rootfs.cpio \
            --write-provenance
          cp sw/linux/rootfs.provenance buildroot/output/images/
          echo "--- verifying the pair the way linux.yaml will ---"
          python3 sw/linux/check_initramfs.py sw/linux/rootfs.cpio

      # ---- the card image -----------------------------------------------
      # The ext2 that goes on the microSD's p2, which is what makes koti
      # REMEMBER. Checked here rather than on the machine, because the failure
      # mode is nasty: /init switch_roots into it and only then discovers the
      # filesystem is unusable — after the initramfs has been discarded, which
      # is the one point in the boot with nothing left to fall back to. So the
      # things /init cannot verify at runtime get verified here.
      #
      # debugfs rather than a loopback mount: no root needed on the runner, and
      # it reads the on-disk structures directly, which is what the kernel will
      # do too.
      - name: The card filesystem is one koti could switch_root into
        run: |
          img=buildroot/output/images/rootfs.ext2
          ls -l "$img"
          dumpe2fs -h "$img"
          echo "--- /sbin/init must exist and be executable ---"
          # A dangling symlink or a mode-644 init is a panic after the point of
          # no return.
          #
          # ⛔ THIS USED TO SAY "and be executable" AND ONLY CHECK THE TYPE:
          #     grep -q "Type: symlink\|Type: regular" init.stat
          # A mode-644 regular file passes that, and it is exactly the failure
          # the step exists to prevent. It also assumed debugfs follows the
          # link; it does not — `stat` on a symlink reports the SYMLINK's inode,
          # whose mode is 0777 no matter how broken the target is. So Buildroot's
          # /sbin/init -> ../bin/busybox would have "passed" on the strength of
          # a symlink's permission bits.
          debugfs -R "stat /sbin/init" "$img" 2>&1 | tee init.stat
          grep -q "Type: symlink\|Type: regular" init.stat

          target=/sbin/init
          if grep -q "Type: symlink" init.stat; then
            dest=$(sed -n 's/.*[Ll]ink dest: *"\?\([^"]*\)"\?.*/\1/p' init.stat | head -1)
            test -n "$dest" || { echo "symlink with no readable destination"; exit 1; }
            case "$dest" in
              /*) target=$dest ;;
              *)  target=$(printf '%s\n' "/sbin/$dest" \
                    | sed ':a;s#/[^/]*/\.\./#/#;ta;s#/\./#/#g') ;;
            esac
            echo "  /sbin/init is a symlink to $dest -> resolving as $target"
            debugfs -R "stat $target" "$img" 2>&1 | tee init.stat
            grep -q "Type: regular" init.stat \
              || { echo "$target is not a regular file"; exit 1; }
          fi

          # Fail loudly if the mode cannot be read: an unparsed mode must never
          # be silently treated as fine, which is the whole lesson above.
          mode=$(sed -n 's/.*Mode: *0*\([0-7]\{3,4\}\).*/\1/p' init.stat | head -1)
          test -n "$mode" || { echo "could not read the mode of $target"; exit 1; }
          test $(( 8#$mode & 8#111 )) -ne 0 \
            || { echo "$target has mode $mode — no execute bit, koti would panic"; exit 1; }
          echo "  ok  $target is mode $mode, executable"
          echo "--- and the things /init itself checks for ---"
          for p in /bin/busybox /dev/console /etc/inittab /sbin/switch_root; do
            debugfs -R "stat $p" "$img" > /dev/null 2>&1 \
              || { echo "MISSING from the card filesystem: $p"; exit 1; }
            echo "  ok  $p"
          done
          # It has to fit the partition tools/sdkernel.py writes it into.
          # ROOTFS_PART_LBA is 18432 and p2 runs to the end of a ~29 GB card,
          # so this is a sanity bound rather than a tight one — but an image
          # larger than the partition would be written straight past its end.
          bytes=$(stat -c%s "$img")
          test "$bytes" -le $((512 * 1024 * 1024)) \
            || { echo "rootfs.ext2 is $bytes bytes, unexpectedly large"; exit 1; }
          echo "rootfs.ext2: $bytes bytes, ready for 'sdkernel.py writefs'"

      # What is actually in it, for the run where the size gate above fails.
      # The first successful build was 4.09 MiB and this listing is how it was
      # diagnosed in one look: 1.6 MB of libc.so.6 and 1.2 MB of libm.so.6.
      - name: What is in it
        if: success() || failure()
        run: |
          ls -l buildroot/output/images/rootfs.cpio
          find buildroot/output/target -type f -printf '%10s  %P\n' \
            | sort -rn | head -15

      # ---- the Finnish keymap, generated rather than hand-written -----------
      # koti's screen types a US layout: koti_kbd.c reports a KEYCODE and LINUX
      # decides the character, and the kernel's built-in keymap is US. So `-`
      # comes out as `/` -- HID usage 0x38 is "the key right of period", which
      # differs between boards. That is item 9 working as designed (the keymap
      # became changeable); it just has not been changed yet.
      #
      # ⛔ WHY THIS IS GENERATED IN CI AND NOT WRITTEN BY HAND. busybox's
      # `loadkmap` loads WHOLE TABLES, not individual keys, so a keymap has to
      # be complete for every keycode in plain/shift/AltGr -- and every mistake
      # is a key that silently does the wrong thing, findable only by typing it
      # on the hardware. `loadkeys --bkeymap` emits exactly that file from the
      # kbd project's own upstream data, which is correct by construction.
      #
      # ⚠️ It is NOT the kbd package in the rootfs: that would be megabytes
      # against a budget check_rootfs.py enforces, for a ~2 KB data file. Only
      # the file ships; busybox already has loadkmap built in.
      - name: Generate the Finnish keymap
        run: |
          sudo apt-get install -y --no-install-recommends kbd console-data
          loadkeys --bkeymap fi > koti-fi.bmap
          ls -l koti-fi.bmap
          head -c 7 koti-fi.bmap | od -c | head -1     # expect "bkeymap"

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: koti-rootfs
          path: |
            buildroot/output/images/rootfs.cpio
            buildroot/output/images/rootfs.provenance
            buildroot/output/images/rootfs.ext2
            buildroot-config.txt
            koti-fi.bmap
