name: fpga-ulx3s

# Builds the ULX3S 85F prototype bitstream: yosys -> nextpnr-ecp5 -> ecppack.
#
# NOT to be confused with `fpga.yaml`, which is TinyTapeout's stock
# ICE40UP5K action for TT's ASIC-simulation FPGA board — a different chip, a
# different board, and disabled (`branches: none`). This workflow is the one
# that produces something you can flash onto the ULX3S.
#
# It lives in CI rather than on the developer's PC on purpose: the 85F
# place-and-route is the slow step by a wide margin, and local heavy compute is
# off-limits on this project (policy, 2026-07-24).
# `fpga/ulx3s/synth.ps1 -SynthOnly` is the local equivalent for a fast RTL
# check; it stops after yosys.
#
# The toolchain is PINNED to the same oss-cad-suite release installed on the
# development machine, so a CI cell count that disagrees with the local one
# means the DESIGN changed, not the tools.

on:
  push:
    paths:
      - 'src/**'
      - 'fpga/ulx3s/**'
      - '.github/workflows/fpga-ulx3s.yaml'
  workflow_dispatch:
    inputs:
      # Which software the `bram` variant carries. The image is baked into the
      # bitstream by $readmemh at synthesis, so changing it is a place-and-route,
      # not a reflash — this input is what keeps that from also being a commit.
      #
      #   bringup  prints forever, never touches video. The default, and the only
      #            image whose banner can be read without racing 5 ms.
      #   memtest  walks the 16 MB RAM window with an address-derived pattern.
      #            The one that proves the SDRAM's address decode rather than
      #            just its read timing.
      #   sdtest   initialises the microSD card and reads blocks from it, then
      #            checks the two properties that hold for ANY card: the same
      #            block reads the same twice, and a different block reads
      #            differently.
      #   sdraw    the layer BELOW sdtest: hand-clocks CMD0 through the SD_RAW
      #            escape hatch with the sd_spi engine muxed off the pins, and
      #            prints the raw bytes. Use when sdtest says SD_ERR — it is the
      #            only image that distinguishes a silent card from a broken
      #            engine, which simulation structurally cannot do.
      #   hello    the demo: banner, then VGA. ⚠️ Its banner is unreadable in
      #            practice and afterwards uo[0] carries the video raster.
      image:
        description: 'bram variant: which software to bake into the fabric flash'
        default: 'bringup'
        type: choice
        options: ['bringup', 'memtest', 'sdtest', 'sdraw', 'hello']

env:
  OSS_TAG: '2026-07-17'
  OSS_TARBALL: 'oss-cad-suite-linux-x64-20260717.tgz'

jobs:
  bitstream:
    runs-on: ubuntu-24.04
    # TWO bitstreams, built in parallel, because there are two boards' worth of
    # reality to serve and dropping either one is a silent loss:
    #
    #   pmod  the original. Boots by XIP from a memory Pmod on J1. This is what
    #         the silicon will do, so it must keep building — but J1 is bare
    #         holes until the Cartridge Pmod arrives, so it CANNOT be tested on
    #         hardware today.
    #   bram  the same SoC with fpga/ulx3s/bram_flash.sv answering on the same
    #         eight uio wires — a QSPI device in fabric. Boots with NOTHING
    #         plugged in, which makes it the only variant that can be put on the
    #         board right now.
    #
    # A matrix rather than a default plus an opt-in: an opt-in variant is one
    # nobody builds, and "the flashable build" and "the build that matches the
    # chip" both need to stay green. They run concurrently, so the wall clock is
    # one place-and-route, not two.
    strategy:
      fail-fast: false
      matrix:
        variant: [pmod, bram]
    steps:
      - uses: actions/checkout@v4

      # Cheap, and it fails in seconds on the mistake that would otherwise
      # surface as a confusing nextpnr error minutes into the run.
      - name: check the pin plan
        run: python3 fpga/ulx3s/check_pins.py

      - name: cache oss-cad-suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_TAG }}

      - name: install oss-cad-suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_TAG}/${OSS_TARBALL}"
          echo "downloading $url"
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$url"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          test -x "$HOME/oss-cad-suite/bin/nextpnr-ecp5"

      - name: put oss-cad-suite on PATH
        run: echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: tool versions
        run: |
          yosys -V
          nextpnr-ecp5 --version

      # Source list comes from fpga/ulx3s/sources.txt — the same file synth.ps1
      # reads, so the two builders cannot drift apart. `-I src` is what makes
      # vga_text.sv's `font_rom.svh` include resolve from the repo root.
      # Only the `bram` variant needs an image, and it needs it BEFORE yosys:
      # bram_flash.sv reads it with $readmemh at elaboration, and yosys turns
      # that into the block RAM's initial contents. A missing file is not a
      # build error — it is a bitstream full of zeroes, which on the board is a
      # CPU executing 0x00000000 forever. So generate it, and let the script's
      # own size check fail the run if the image does not fit.
      - name: the fabric flash image
        if: matrix.variant == 'bram'
        run: |
          mkdir -p fpga/ulx3s/build
          img="${{ inputs.image || 'bringup' }}"
          echo "baking sw/$img.bin into the fabric flash"
          python3 fpga/ulx3s/mkflashhex.py "sw/$img.bin" fpga/ulx3s/build/flash.hex
          wc -l fpga/ulx3s/build/flash.hex

      - name: synthesis (yosys)
        run: |
          mkdir -p fpga/ulx3s/build
          src=$(grep -vE '^[[:space:]]*(#|$)' fpga/ulx3s/sources.txt | tr '\n' ' ')
          echo "sources: $src"
          # The fabric flash is an extra source AND an extra define, and both
          # only for the bram variant. Kept in one shell variable so the yosys
          # line below stays a single command in both cases.
          if [ "${{ matrix.variant }}" = "bram" ]; then
            src="fpga/ulx3s/bram_flash.sv $src"
            extra="-DKOTI_FLASH_BRAM"
          else
            extra=""
          fi
          echo "variant=${{ matrix.variant }} extra=$extra"
          # -DKOTI_FPGA serves the RAM half of the memory map from the board's
          # onboard 32 MB SDRAM rather than the QSPI Pmod's PSRAM. Must match
          # fpga/ulx3s/synth.ps1 and test/run_fpga.py: if the simulated and the
          # synthesised configurations differ, the suite proves nothing about
          # the bitstream.
          yosys -l fpga/ulx3s/build/yosys.log \
            -p "read_verilog -sv -DKOTI_FPGA $extra -I src $src; synth_ecp5 -top ulx3s_top -json fpga/ulx3s/build/koti.json"

      # nextpnr fails by design when the 25 MHz constraint in ulx3s.lpf is not
      # met. Capture its exit code instead of letting the step die, so the
      # achieved Fmax still reaches the summary and the artifact on a red run —
      # "how far off were we" is the whole point of the number.
      - name: place and route (nextpnr-ecp5)
        id: pnr
        run: |
          set +e
          set -o pipefail
          nextpnr-ecp5 --85k --package CABGA381 \
            --json fpga/ulx3s/build/koti.json \
            --lpf fpga/ulx3s/ulx3s.lpf \
            --textcfg fpga/ulx3s/build/koti.config 2>&1 | tee fpga/ulx3s/build/nextpnr.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: pack bitstream (ecppack)
        if: steps.pnr.outputs.rc == '0'
        run: |
          ecppack fpga/ulx3s/build/koti.config fpga/ulx3s/build/koti-${{ matrix.variant }}.bit
          ls -l fpga/ulx3s/build/koti-${{ matrix.variant }}.bit

      - name: report
        if: always()
        run: |
          set +e
          {
            echo "## Koti-1 — ULX3S 85F (LFE5U-85F, CABGA381) — ${{ matrix.variant }}"
            echo
            echo "### Logic"
            echo '```'
            # TRELLIS_COMB/TRELLIS_FF sit near the END of nextpnr's utilisation
            # table — a short window silently cuts off the two numbers a human
            # actually wants.
            grep -E "Total LUT4s|TRELLIS_COMB|TRELLIS_FF|TRELLIS_IO|DP16KD|MULT18X18D|CCU2C" fpga/ulx3s/build/nextpnr.log | head -12
            echo '```'
            echo "### Timing (constraint: 25 MHz, from fpga/ulx3s/ulx3s.lpf)"
            echo '```'
            grep -E "Max frequency for clock|Max delay|Info: Critical path" fpga/ulx3s/build/nextpnr.log | head -20
            echo '```'
            echo "nextpnr prints **Max frequency twice**; the FIRST is a"
            echo "post-PLACEMENT estimate and is routinely a FAIL. Quote the"
            echo "second. This run's post-route figure is gated below."
            if [ "${{ steps.pnr.outputs.rc }}" != "0" ]; then
              echo
              echo "**nextpnr exited ${{ steps.pnr.outputs.rc }}** — full log in the artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koti-fpga-${{ matrix.variant }}
          path: |
            fpga/ulx3s/build/koti-${{ matrix.variant }}.bit
            fpga/ulx3s/build/yosys.log
            fpga/ulx3s/build/nextpnr.log
          if-no-files-found: warn

      - name: gate on place-and-route result
        run: |
          if [ "${{ steps.pnr.outputs.rc }}" != "0" ]; then
            echo "::error::nextpnr-ecp5 exited ${{ steps.pnr.outputs.rc }}. If this is a timing violation, the achieved Fmax is in the job summary and in fpga/ulx3s/build/nextpnr.log in the koti-fpga artifact."
            exit 1
          fi

          # Belt as well as braces. The exit code above is nextpnr's own
          # verdict, and it is the right primary gate — but it is one boolean
          # from a tool that prints TWO Max-frequency lines, of which the first
          # is a post-PLACEMENT estimate that is often a FAIL on a design that
          # closes fine after routing. Asserting on the LAST line encodes
          # "the second one is the real one" in the workflow instead of leaving
          # it as a rule people have to remember while reading a log.
          last=$(grep "Max frequency for clock" fpga/ulx3s/build/nextpnr.log \
                 | tail -1)
          echo "post-route: $last"
          case "$last" in
            *"(PASS"*) ;;
            *) echo "::error::post-route timing did not pass: $last"; exit 1 ;;
          esac
