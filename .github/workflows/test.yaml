name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      # sdram_ctrl against a strict behavioural part. Standalone because the
      # controller is verified before it goes anywhere near the SoC — a memory
      # controller that is wrong in a corner is far cheaper to find here than
      # under a running kernel.
      - name: SDRAM controller
        run: |
          cd test
          python run_sdram.py
          ! grep failure results_sdram.xml

      # icache standalone. Pure Verilog on purpose — no cocotb — so it also runs
      # on the Windows host, where cocotb is not installed and every other suite
      # therefore costs a CI round trip.
      #
      # It asserts on the MEMORY TRANSACTION COUNT, not just on returned data. A
      # cache whose `valid` never sets returns correct data for every request
      # and delivers none of the speedup, so counting is the only check that
      # tells a working cache from an expensive wire.
      - name: I-cache
        run: |
          cd test
          iverilog -g2012 -o tb_icache.vvp ../src/icache.sv tb_icache.v
          vvp tb_icache.vvp | tee icache.log
          grep -q "tb_icache: PASS" icache.log

      # PLIC standalone, same pure-Verilog pattern. An interrupt controller is
      # another block that can be wrong by being QUIET: one that never asserts
      # eip breaks nothing visible in a polling system, it just means
      # interrupts never arrive. The bench therefore asserts on the
      # claim/complete SEQUENCE, and its own discriminating power was checked
      # by mutation — flipping the threshold comparison, the tie-break
      # direction, or the in-flight latch each make it fail.
      - name: PLIC
        run: |
          cd test
          iverilog -g2012 -o tb_plic.vvp ../src/plic.sv tb_plic.v
          vvp tb_plic.vvp | tee plic.log
          grep -q "tb_plic: PASS" plic.log

      # The machine description has to actually compile. koti.dts went into the
      # repo unvalidated because there is no dtc on the development host, and
      # a devicetree that is quoted as the machine's definition but has never
      # been through a compiler is a latent boot failure.
      # WARNINGS ARE FAILURES here, and deliberately so. dtc exits 0 on a
      # warning, so the first version of this step went green while reporting
      # that /soc/timer had no reg property — a real modelling error (a node
      # with no address does not belong on a simple-bus) sitting in a file
      # quoted as the machine's definition. A devicetree is read by exactly one
      # consumer, once, early, with no console up yet; there is no good time to
      # find out it was approximately right.
      - name: Devicetree
        run: |
          sudo apt-get install -y device-tree-compiler
          dtc -I dts -O dtb -o /tmp/koti.dtb sw/linux/koti.dts 2>dtc.log
          cat dtc.log
          ! grep -q Warning dtc.log
          dtc -I dtb -O dts /tmp/koti.dtb > /dev/null

      # The suite above drives tt_um_koti directly. This one drives the ULX3S
      # harness (fpga/ulx3s/ulx3s_top.sv) through the J1 header wires, which is
      # the only thing that exercises the Pmod row permutation, the orientation
      # straps and the UART source mux. See test/test_fpga.py.
      - name: ULX3S harness simulation
        run: |
          cd test
          python run_fpga.py
          ! grep failure results_fpga.xml

      # The variant that actually goes on the board today, because J1 is bare
      # holes until the Cartridge Pmod arrives: the boot flash is
      # fpga/ulx3s/bram_flash.sv, a QSPI device in fabric on the same eight uio
      # wires. The step above cannot cover it — it drives the header pins, and
      # in this build nothing is listening to them.
      #
      # Plain Verilog rather than cocotb, so it also runs on the development
      # host in seconds. What it is really guarding is ONE thing: that the model
      # answers on the edge qspi_ctrl samples. One edge out and every fetched
      # word is shifted by a bit, which on the bench is a board that configures,
      # blinks, and never says anything.
      - name: ULX3S harness with the fabric boot flash
        run: |
          mkdir -p fpga/ulx3s/build
          python3 fpga/ulx3s/mkflashhex.py sw/bringup.bin fpga/ulx3s/build/flash.hex
          iverilog -g2012 -I src -DKOTI_FPGA -DKOTI_FLASH_BRAM \
            -o tb_fpga_bram.vvp src/*.sv fpga/ulx3s/bram_flash.sv \
            fpga/ulx3s/ulx3s_top.sv test/sdram_model.sv test/tb_fpga_bram.v \
            2>&1 | grep -v "sorry:" || true
          vvp tb_fpga_bram.vvp | tee fpga_bram.log
          grep -q "tb_fpga_bram: PASS" fpga_bram.log

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/tb_fpga.fst
            test/results.xml
            test/results_fpga.xml
            test/results_sdram.xml
            test/output/*
